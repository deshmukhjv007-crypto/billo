/* ============ Billo "Midnight" design — v1.5 ============
   Dark first. Names and money in Unbounded, everything else in Sora.
   Mint = money coming to you, coral = money you pay. Words always say it too. */

:root{
  --bg:#F7F4EE; --paper:#FFFFFF; --paper2:#F1EDE5; --ink:#1A1A2E; --ink2:#34344A; --dim:#5F5E6B; --faint:#8B8A96;
  --rule:#E6E0D4; --line:#E6E0D4; --field:#FFFFFF; --hair:#EDE8DE;
  --accent:#3B3BF5; --on-accent:#FFFFFF; --get:#177A42; --owe:#B83232; --warn:#7A5200;
  --get-bg:#E4F3EA; --get-bd:#BFE3CD; --owe-bg:#FBE8E8; --owe-bd:#F2C4C4; --warn-bg:#FFF1D6; --warn-bd:#F0D9A6;
  --well:#FFFFFF; --well-sh:inset 0 1px 3px rgba(26,26,46,.07); --knob:#3B3BF5; --knob-edge:#2B2BD0; --knob-ico:#FFFFFF;
  --dock:#FFFFFF; --dock-bd:#E6E0D4; --dock-ink:#1A1A2E; --dock-dim:#8B8A96; --dmain-bg:#1A1A2E; --dmain-fg:#FFFFFF; --dmic-bg:#3B3BF5; --dmic-fg:#FFFFFF;
  --me-bg:#1A1A2E; --me-fg:#FFFFFF; --tile-bg:#EEEEFF; --tile-fg:#3B3BF5;
  --glow:rgba(59,59,245,.22); --shadow:0 10px 30px rgba(26,26,46,.10);
  --mono:"Manrope",system-ui,-apple-system,"Segoe UI","Noto Sans","Noto Sans Devanagari",sans-serif;
  --serif:"Bricolage Grotesque","Manrope",system-ui,"Noto Sans Devanagari",sans-serif;
  --sans:"Manrope",system-ui,-apple-system,"Segoe UI","Noto Sans","Noto Sans Devanagari",sans-serif;
  color-scheme:light;
}
:root[data-theme="dark"]{
  --bg:#0B0C10; --paper:#14161C; --paper2:#1A1D24; --ink:#F2F3F7; --ink2:#C9CCD6; --dim:#8E93A3; --faint:#6B6F7C;
  --rule:#262932; --line:#262932; --field:#0F1115; --hair:#1E2129;
  --accent:#7CF5C4; --on-accent:#0B0C10; --get:#7CF5C4; --owe:#FF8A6B; --warn:#FFB547;
  --get-bg:#10251E; --get-bd:#1F5A45; --owe-bg:#2A1714; --owe-bd:#5A2C22; --warn-bg:#2A2112; --warn-bd:#5C4A1E;
  --well:#050608; --well-sh:inset 0 2px 8px rgba(0,0,0,.55); --knob:#FFFFFF; --knob-edge:#B8BCC6; --knob-ico:#0B0C10;
  --dock:#F2F3F7; --dock-bd:transparent; --dock-ink:#0B0C10; --dock-dim:#6B6F7C; --dmain-bg:#0B0C10; --dmain-fg:#7CF5C4; --dmic-bg:#7CF5C4; --dmic-fg:#0B0C10;
  --me-bg:#FFB547; --me-fg:#0B0C10; --tile-bg:#1D2030; --tile-fg:#B4B4FF;
  --glow:rgba(124,245,196,.16); --shadow:0 10px 30px rgba(0,0,0,.45);
  color-scheme:dark;
}
:root[data-theme="paper"]{
  --bg:#FFFFFF; --paper:#FFFFFF; --paper2:#F4F4F6; --ink:#111111; --ink2:#2B2B2B; --dim:#5E5E66; --faint:#8A8A92;
  --rule:#E4E4E8; --line:#E4E4E8; --field:#FFFFFF; --hair:#EEEEF1;
  --accent:#111111; --on-accent:#FFFFFF; --get:#167A3E; --owe:#B42F2F; --warn:#7A5200;
  --get-bg:#E7F4EC; --get-bd:#C2E3CF; --owe-bg:#FBE9E9; --owe-bd:#F1C6C6; --warn-bg:#FFF3DC; --warn-bd:#F2D49A;
  --well:#F4F4F6; --well-sh:inset 0 1px 3px rgba(0,0,0,.06); --knob:#111111; --knob-edge:#000000; --knob-ico:#FFFFFF;
  --dock:#FFFFFF; --dock-bd:#E4E4E8; --dock-ink:#111111; --dock-dim:#8A8A92; --dmain-bg:#111111; --dmain-fg:#FFFFFF; --dmic-bg:#111111; --dmic-fg:#FFFFFF;
  --me-bg:#111111; --me-fg:#FFFFFF; --tile-bg:#F1F1F4; --tile-fg:#111111;
  --glow:rgba(0,0,0,.12); --shadow:0 10px 30px rgba(0,0,0,.08);
  color-scheme:light;
}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:15.5px;line-height:1.45;overflow-x:hidden;-webkit-font-smoothing:antialiased}
.wrap{max-width:464px;margin:0 auto;min-height:100dvh;position:relative;z-index:1;padding:0 18px 120px}
#screen{padding-top:calc(10px + env(safe-area-inset-top))}
#screen.anim{animation:fadeup .24s ease both}
@keyframes fadeup{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
@keyframes pop{0%{transform:scale(.3);opacity:0}60%{transform:scale(1.08)}100%{transform:scale(1);opacity:1}}
@keyframes stamp{0%{transform:rotate(-10deg) scale(2.2);opacity:0}55%{transform:rotate(-10deg) scale(.94);opacity:.95}100%{transform:rotate(-10deg) scale(1);opacity:.9}}
@keyframes print{from{clip-path:inset(0 0 100% 0)}to{clip-path:inset(0 0 0 0)}}
@keyframes flow{to{stroke-dashoffset:-28}}
@keyframes pulse{0%{transform:scale(1);opacity:.55}100%{transform:scale(1.9);opacity:0}}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes shine{0%{background-position:200% 0}100%{background-position:-200% 0}}
@keyframes wave{0%,100%{transform:scaleY(.35)}50%{transform:scaleY(1)}}
@keyframes ring{0%{transform:scale(1);opacity:.5}100%{transform:scale(2.1);opacity:0}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
.mono,.num{font-family:var(--mono);font-variant-numeric:tabular-nums}
.serif{font-family:var(--serif);font-weight:700}
.lbl{font-size:11.5px;letter-spacing:1.6px;color:var(--dim);text-transform:uppercase;font-weight:600}
.ico{width:18px;height:18px;flex:none;display:block}
.ico.s{width:15px;height:15px}
.ico.l{width:22px;height:22px}

/* ---------- header ---------- */
.top{display:flex;align-items:center;gap:10px;padding:8px 0 14px;position:sticky;top:0;background:var(--bg);z-index:5}
.brand{display:flex;align-items:center;gap:9px;flex:1}
.logo{display:none}
.wordmark{font-family:var(--serif);font-size:22px;font-weight:800;letter-spacing:-.3px;line-height:1}
.wordmark .dot{color:var(--accent)}
.top-actions{display:flex;gap:8px;align-items:center}
.iconbtn{width:44px;height:44px;border-radius:14px;border:1px solid var(--line);background:var(--paper);color:var(--ink);cursor:pointer;display:flex;align-items:center;justify-content:center;flex:none;padding:0}
.iconbtn:active{transform:scale(.94)}
.iconbtn.small{width:36px;height:36px;border-radius:12px}
.ttit{flex:1;display:flex;align-items:center;gap:10px;min-width:0}
.temoji{display:none}
.tname{font-family:var(--serif);font-size:19px;line-height:1.15;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-weight:700}
.tcode{font-size:12px;color:var(--dim);margin-top:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sm{font-size:12.5px}

/* ---------- surfaces ---------- */
.card{background:var(--paper);border:1px solid var(--line);border-radius:22px;padding:16px 18px;margin-bottom:14px;position:relative}
.card.flat{margin-bottom:12px}
.muted{color:var(--dim)}
.grow{flex:1}
.row{display:flex;align-items:center;gap:10px}
.right{text-align:right}
.rule{border-top:1px solid var(--hair);margin:14px 0}
.rule.solid{border-top:1px solid var(--line)}
.lead{display:flex;gap:8px;align-items:baseline;font-variant-numeric:tabular-nums}
.lead .fill{flex:1;min-width:12px}
.neg{color:var(--owe)}
.pos{color:var(--get)}

/* ---------- buttons & fields ---------- */
.btn{border:none;border-radius:16px;padding:14px 18px;font-size:15px;font-weight:700;cursor:pointer;font-family:var(--sans);transition:transform .08s;display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:48px;color:var(--ink)}
.btn:active{transform:scale(.98)}
.btn-primary{background:var(--ink);color:var(--bg)}
.btn-primary .ico{stroke:var(--bg)}
.btn-accent{background:var(--accent);color:var(--on-accent)}
.btn-accent .ico{stroke:var(--on-accent)}
.btn-ghost{background:var(--paper);color:var(--ink);border:1px solid var(--line)}
.btn-danger{background:transparent;color:var(--owe);border:1px solid var(--owe-bd)}
.btn.mini{padding:8px 13px;font-size:13px;min-height:38px;border-radius:12px}
.btn.big{width:100%;padding:16px;font-size:16px;min-height:56px;border-radius:18px}
.btnrow{display:flex;gap:10px;margin-top:16px}
.input{width:100%;background:var(--field);border:1px solid var(--line);border-radius:14px;color:var(--ink);font-size:16px;padding:13px 14px;font-family:var(--sans);outline:none}
.input:focus{border-color:var(--accent)}
.input::placeholder{color:var(--faint)}
select.input{appearance:none}
textarea.input{resize:none;line-height:1.5}
.fld{margin-bottom:18px}
.fld label{display:block;font-size:11.5px;font-weight:600;color:var(--dim);margin-bottom:8px;text-transform:uppercase;letter-spacing:1.6px}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{border:1px solid var(--line);background:var(--paper);color:var(--ink);border-radius:999px;padding:0 14px;min-height:40px;font-size:14px;font-weight:600;cursor:pointer;display:inline-flex;align-items:center;gap:7px;font-family:var(--sans)}
.chip.on{background:var(--ink);border-color:var(--ink);color:var(--bg)}
.chip:active{transform:scale(.96)}
.chip.cat-on{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.chip .ico{width:15px;height:15px}
.chip.on .av{box-shadow:0 0 0 2px var(--bg)}
.badge{font-size:10.5px;font-weight:700;border:1px solid currentColor;padding:3px 9px;letter-spacing:1.2px;border-radius:999px}
.badge.pro{color:var(--warn)}
.badge.ok{color:var(--get)}

/* avatars */
.av{width:36px;height:36px;border-radius:50%;display:inline-flex;align-items:center;justify-content:center;font-weight:700;font-size:14px;color:#0B0C10;flex:none;background:var(--c,#B9A8FF)}
.av.sm{width:30px;height:30px;font-size:12px}
.av.xs{width:22px;height:22px;font-size:10px}
.av.lg{width:52px;height:52px;font-size:18px}

/* ---------- home ---------- */
.greet{font-size:14px;color:var(--dim);margin:2px 0 0}
.headline{font-family:var(--serif);font-weight:700;font-size:25px;line-height:1.2;margin:2px 0 6px}
.tagline{color:var(--dim);font-size:14.5px;margin-bottom:16px}
.tagline b{color:var(--ink)}
.home-cta{display:flex;gap:10px;margin:16px 0 22px}
.home-cta .btn{flex:1}
.sec-row{display:flex;align-items:baseline;justify-content:space-between;margin:18px 0 12px}
.sec-row b{font-family:var(--serif);font-weight:700;font-size:15px}
.gcards{display:flex;gap:10px;overflow-x:auto;padding-bottom:6px;margin:0 -18px;padding-left:18px;padding-right:18px;scroll-snap-type:x mandatory;scrollbar-width:none}
.gcards::-webkit-scrollbar{display:none}
.gcard{min-width:156px;max-width:210px;flex:none;border-radius:22px;background:var(--paper);border:1px solid var(--line);padding:14px;display:flex;flex-direction:column;gap:10px;cursor:pointer;scroll-snap-align:start;text-align:left;color:var(--ink);font-family:var(--sans)}
.gcard:active{transform:scale(.98)}
.gcard .gn{font-family:var(--serif);font-weight:700;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.gcard .gm{font-size:12px;color:var(--dim)}
.gcard .gl{font-size:13px;font-weight:600}
.gcard.add{border-style:dashed;align-items:center;justify-content:center;color:var(--dim);min-width:120px}
.tripc{display:flex;align-items:center;gap:14px;cursor:pointer}
.tripc.done .tinfo,.tripc.done .tbad{opacity:.6}
.etile{width:44px;height:44px;border-radius:14px;background:var(--paper2);display:flex;align-items:center;justify-content:center;flex:none;color:var(--ink2);position:relative}
.etile.sm{width:42px;height:42px}
.etile.xs{width:36px;height:36px;border-radius:12px}
.etile .payer{position:absolute;right:-5px;bottom:-5px;box-shadow:0 0 0 2px var(--paper)}
.tinfo{flex:1;min-width:0}
.tsub{color:var(--dim);font-size:12px;margin-top:4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tbad{display:flex;flex-direction:column;align-items:flex-end;gap:1px;font-weight:700;font-size:16px;white-space:nowrap}
.tbad small{font-weight:400;font-size:12px;color:var(--dim)}
.tbad.owe{color:var(--owe)} .tbad.get{color:var(--get)} .tbad.ok{color:var(--dim);font-size:14px}
.stampmini{position:absolute;right:14px;top:12px;border:1.5px solid var(--get);color:var(--get);padding:2px 9px;border-radius:999px;font-weight:700;font-size:11px;letter-spacing:1.5px;pointer-events:none}

/* your circle */
.orbit{position:relative;width:100%;max-width:380px;aspect-ratio:350/300;margin:4px auto 8px}
.orbit .halo{position:absolute;left:50%;top:50%;width:240px;height:240px;margin:-120px 0 0 -120px;border-radius:50%;background:radial-gradient(circle,var(--glow) 0%,transparent 70%)}
.orbit svg{position:absolute;left:0;top:0;width:100%;height:100%;overflow:visible}
.orbit .rings{animation:spin 40s linear infinite;transform-origin:50% 50%;transform-box:fill-box}
.orbit .fl{animation:flow 1.1s linear infinite}
.orbit .me{position:absolute;left:50%;top:50%;width:68px;height:68px;margin:-34px 0 0 -34px}
.orbit .me .pl{position:absolute;inset:0;border-radius:50%;border:2px solid var(--accent);animation:pulse 2.4s ease-out infinite}
.orbit .me .core{position:absolute;inset:0;border-radius:50%;background:#FFB547;color:#0B0C10;display:flex;align-items:center;justify-content:center;font-family:var(--serif);font-weight:800;font-size:16px;box-shadow:0 0 0 5px var(--bg),0 0 0 6px var(--line),0 0 28px rgba(255,181,71,.4)}
.onode{position:absolute;display:flex;flex-direction:column;gap:6px;max-width:48%;cursor:pointer;background:none;border:none;color:var(--ink);font-family:var(--sans);padding:0}
.onode.l{align-items:flex-start;text-align:left} .onode.r{align-items:flex-end;text-align:right}
.onode .av{width:50px;height:50px;font-size:18px}
.opill{border-radius:999px;padding:4px 10px;font-size:12px;line-height:1.35;border:1px solid var(--line);background:var(--paper);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%}
.opill.get{background:var(--get-bg);border-color:var(--get-bd)}
.opill.owe{background:var(--owe-bg);border-color:var(--owe-bd)}
.opill.zero{color:var(--ink2)}
.orbit-empty{position:absolute;left:0;right:0;bottom:22px;text-align:center;color:var(--dim);font-size:13px;padding:0 30px}

/* slide to pay (like the old "slide to unlock") */
.slide{position:relative;height:66px;border-radius:20px;background:var(--well);border:1px solid var(--line);box-shadow:inset 0 2px 8px rgba(0,0,0,.55);display:flex;align-items:center;padding:6px;user-select:none;-webkit-user-select:none;touch-action:pan-y;overflow:hidden;margin:6px 0 4px}
.slide .knob{position:relative;z-index:2;width:70px;height:52px;border-radius:14px;background:var(--knob);box-shadow:inset 0 -3px 0 var(--knob-edge),0 2px 6px rgba(0,0,0,.45);display:flex;align-items:center;justify-content:center;flex:none;cursor:grab;touch-action:none}
.slide .knob .ico{stroke:#2A2D36;width:26px;height:26px}
.slide.save .knob{background:var(--accent);box-shadow:inset 0 -3px 0 rgba(0,0,0,.18),0 2px 6px rgba(0,0,0,.45)}
.slide.save .knob .ico{stroke:var(--on-accent)}
.slide.go .knob{transition:transform .25s ease}
.slide .stxt{position:absolute;left:84px;right:12px;text-align:center;font-size:16px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;background:linear-gradient(90deg,var(--faint) 0%,var(--faint) 40%,var(--ink) 50%,var(--faint) 60%,var(--faint) 100%);background-size:200% 100%;-webkit-background-clip:text;background-clip:text;color:transparent;animation:shine 2.6s linear infinite}
.slide.compact{height:60px}.slide.compact .knob{width:60px;height:48px}.slide.compact .stxt{left:74px;font-size:14.5px}
.slide-alt{display:block;text-align:center;margin:6px auto 0;background:none;border:none;color:var(--dim);font-size:12.5px;font-family:var(--sans);text-decoration:underline;cursor:pointer;padding:6px}

/* dock */
.dock{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(16px + env(safe-area-inset-bottom));width:calc(min(464px,100vw) - 36px);height:64px;border-radius:22px;background:var(--dock);display:flex;align-items:center;justify-content:space-around;z-index:9;box-shadow:var(--shadow)}
.dock button{background:none;border:none;width:48px;height:48px;display:flex;align-items:center;justify-content:center;color:var(--dock-dim);cursor:pointer;border-radius:14px}
.dock button.on{color:var(--dock-ink)}
.dock .ico{width:22px;height:22px}
.dock .dmain{width:76px;background:var(--dock-ink);color:var(--accent);border-radius:16px}
.dock .dmain .ico{width:24px;height:24px;stroke-width:2.6}
.dock .dmic{color:var(--dock-ink)}
.fab{display:none}

/* ---------- trip ---------- */
.hero{padding:18px 18px 16px}
.hero .who{font-size:13.5px;color:var(--dim)}
.hero .big{font-family:var(--serif);font-variant-numeric:tabular-nums;font-size:40px;font-weight:700;letter-spacing:-1.5px;line-height:1.12;margin:2px 0 6px;word-break:break-all}
.hero .big.neg{color:var(--owe)} .hero .big.pos{color:var(--get)}
.hero .btn{margin-top:12px;width:100%}
.hero .hrow{display:flex;align-items:center;gap:12px}
.stats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;margin:0 0 14px}
.stat{padding:12px;border-radius:18px;background:var(--paper);border:1px solid var(--line);min-width:0;display:flex;flex-direction:column}
.stat .v{font-variant-numeric:tabular-nums;font-size:15px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.stat .k{font-size:10.5px;color:var(--dim);text-transform:uppercase;letter-spacing:1.2px;margin-bottom:2px;order:-1}
.gauge{display:flex;align-items:center;gap:14px;cursor:pointer}
.gauge svg{flex:none}
.sec-h{display:flex;align-items:baseline;justify-content:space-between;margin-bottom:12px;gap:10px}
.sec-h b{font-family:var(--serif);font-weight:700;font-size:15px}
.sec-h .muted.sm{font-size:12px}
.mini-link{background:none;border:none;color:var(--accent);font-weight:700;font-size:13.5px;cursor:pointer;font-family:var(--sans);padding:6px 2px;min-height:32px}
.brow{display:flex;align-items:center;gap:11px;padding:10px 0;border-bottom:1px solid var(--hair)}
.brow:last-child{border-bottom:none}
.binfo b{font-size:14.5px;font-weight:600}
.bamt{font-variant-numeric:tabular-nums;font-weight:700;font-size:15px;white-space:nowrap}
.bamt.pos{color:var(--get)} .bamt.neg{color:var(--owe)} .bamt.zero{color:var(--faint);font-size:13.5px}
.frow{display:grid;grid-template-columns:auto minmax(0,1fr) auto;align-items:center;column-gap:10px;row-gap:8px;padding:10px 12px;border-radius:18px;background:var(--paper2);border:1px solid var(--line);margin-bottom:8px}
.frow:last-child{margin-bottom:0}
.frow.mine{border-color:var(--tile-fg);background:var(--tile-bg)}
.frow .pair{display:flex;align-items:center;gap:4px}
.frow .pair .ico{width:18px;height:14px;color:var(--dim)}
.finfo{font-size:14px;min-width:0;overflow-wrap:break-word;line-height:1.35}
.finfo b{font-weight:700}
.finfo .arr{color:var(--faint);margin:0 5px}
.famt{font-family:var(--serif);font-variant-numeric:tabular-nums;font-weight:700;font-size:14px;white-space:nowrap}
.prow{display:flex;align-items:center;gap:10px;padding:8px 0;font-size:14px;border-bottom:1px solid var(--hair)}
.prow:last-child{border-bottom:none}
.erow{display:flex;align-items:center;gap:13px;padding:11px 0;cursor:pointer;border-bottom:1px solid var(--hair)}
.erow:last-of-type{border-bottom:none}
.erow .einfo{flex:1;min-width:0;display:flex;flex-direction:column;gap:3px}
.erow .einfo b{font-weight:600;font-size:14.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.erow .eside{display:flex;flex-direction:column;align-items:flex-end;gap:3px}
.erow .lead{font-size:14px;font-weight:600}
.erow .lead .d{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:62%}
.erow .meta{font-size:12px;color:var(--dim);display:flex;align-items:center;gap:6px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.erow .share{font-size:12px}
.erow:active{background:var(--paper2)}
.ename{font-weight:700;font-size:15px}
.eamt{font-variant-numeric:tabular-nums;font-weight:700;font-size:14.5px;white-space:nowrap}
.settled-badge{color:var(--get);font-size:11px;font-weight:700;margin-left:4px;letter-spacing:1px}
.bill-total{display:flex;justify-content:space-between;border-top:1px solid var(--line);padding-top:12px;margin-top:6px;font-weight:700;font-size:14.5px}
.mrow{display:flex;align-items:center;gap:10px;padding:11px 0;border-bottom:1px solid var(--hair);cursor:pointer}
.mrow:last-child{border-bottom:none}
.mrow.off{opacity:.4}
.tick{width:26px;height:26px;border:1.5px solid var(--line);border-radius:8px;display:inline-flex;align-items:center;justify-content:center;font-size:13px;font-weight:900;color:transparent;flex:none}
.tick.on{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.sec-h.plain{margin:6px 0 10px}
.empty{text-align:center;color:var(--dim);padding:22px 10px;font-size:14.5px}
.empty .serif{font-size:17px;color:var(--ink);display:block;margin-bottom:6px}

/* ---------- add expense ---------- */
.seg{display:grid;grid-auto-flow:column;grid-auto-columns:minmax(0,1fr);gap:4px;padding:4px;border-radius:16px;background:var(--paper);border:1px solid var(--line);margin-bottom:18px}
.seg-b{border:none;background:transparent;color:var(--dim);font-weight:600;font-size:13.5px;padding:10px 4px;cursor:pointer;border-radius:12px;white-space:nowrap;min-height:42px;font-family:var(--sans)}
.seg-b.on{color:var(--bg);background:var(--ink)}
.seg-b .ico{display:none}
.sm-seg{margin:0 0 12px}
.sm-seg .seg-b{font-size:12.5px;min-height:38px;padding:8px 4px}
.tile{border:1.5px dashed var(--line);border-radius:20px;padding:30px 16px;text-align:center;cursor:pointer;background:var(--paper);margin-bottom:14px}
.photo-prev{width:100%;max-height:240px;object-fit:cover;border-radius:18px;margin-bottom:14px;display:block}
.amt-wrap{display:flex;align-items:baseline;gap:6px;background:var(--paper);border:1px solid var(--line);border-radius:22px;padding:14px 18px;margin-bottom:18px}
.amt-wrap .cur{font-family:var(--serif);font-size:28px;font-weight:700;color:var(--dim)}
.amt-in{flex:1;min-width:0;background:none;border:none;outline:none;color:var(--ink);font-size:38px;font-weight:700;font-family:var(--serif);font-variant-numeric:tabular-nums;letter-spacing:-1.5px;padding:2px 0;caret-color:var(--accent)}
.amt-in::placeholder{color:var(--faint)}
.quote{background:var(--paper);border:1px solid var(--line);border-radius:16px;padding:10px 13px;color:var(--ink2);margin-bottom:14px;font-style:italic;font-size:14px}
.ai-badge{display:inline-flex;align-items:center;gap:6px;font-size:11.5px;font-weight:700;letter-spacing:1px;text-transform:uppercase;color:var(--get);background:var(--get-bg);border:1px solid var(--get-bd);border-radius:999px;padding:5px 11px;margin-bottom:12px}
.hint-learn{font-size:12.5px;color:var(--warn);margin-top:8px;font-weight:600}
.custom-box{background:var(--paper);border:1px solid var(--line);border-radius:18px;padding:12px 14px;margin-top:10px;margin-bottom:12px}
.crow{display:flex;align-items:center;gap:9px;padding:6px 0}
.crow .nm{flex:1;font-size:14px;font-weight:600}
.camt{width:100px;background:var(--field);border:1px solid var(--line);border-radius:12px;color:var(--ink);padding:9px 10px;font-size:14.5px;font-weight:600;font-family:var(--sans);outline:none;text-align:right;min-height:40px}
.camt:focus{border-color:var(--accent)}
.sw{display:flex;align-items:center;gap:8px;font-size:14px;font-weight:600;cursor:pointer;margin-top:10px;color:var(--dim)}
.sw input{width:18px;height:18px;accent-color:var(--accent)}
.sayhint{margin:8px 2px 12px;font-size:13px}
.tpl{font-size:13px}
.saymic{display:flex;align-items:center;gap:12px;width:100%;background:var(--get-bg);border:1px solid var(--get-bd);border-radius:18px;padding:12px 14px;margin-bottom:12px;color:var(--ink);font-family:var(--sans);font-size:14.5px;font-weight:600;cursor:pointer;text-align:left}
.saymic .mi{width:42px;height:42px;border-radius:50%;background:var(--accent);display:flex;align-items:center;justify-content:center;flex:none}
.saymic .mi .ico{stroke:var(--on-accent)}

/* ---------- done / paid ---------- */
.check{width:84px;height:84px;border-radius:50%;background:var(--accent);display:flex;align-items:center;justify-content:center;margin:34px auto 18px;animation:pop .45s cubic-bezier(.2,1.4,.4,1) both;color:var(--on-accent);box-shadow:0 0 40px var(--glow)}
.check .ico{width:42px;height:42px}
.done-wrap{text-align:center;padding-top:8px}
.done-amt{font-family:var(--serif);font-variant-numeric:tabular-nums;font-size:36px;font-weight:700;letter-spacing:-1px}
.done-desc{font-size:16px;color:var(--ink2);margin:4px 0 22px}
.done-flows{display:flex;flex-direction:column;margin:0 auto 26px;max-width:340px;background:var(--paper);border:1px solid var(--line);border-radius:20px;padding:6px 16px;text-align:left}
.dflow{padding:10px 0;font-size:14px;display:flex;justify-content:space-between;gap:10px;border-bottom:1px solid var(--hair)}
.dflow:last-child{border-bottom:none}
.dflow .a{font-weight:700}
.slip{background:var(--paper);border:1px solid var(--line);border-radius:24px;padding:18px 20px;position:relative;margin:26px 0 30px;text-align:left}
.slip .lead{font-size:13.5px;margin:8px 0}
.slip .lead .k{color:var(--dim)}
.slip .amtline{display:flex;justify-content:space-between;align-items:baseline;font-weight:700}
.slip .amtline b{font-family:var(--serif);font-size:28px;letter-spacing:-1px;font-variant-numeric:tabular-nums}
.slip .head{text-align:center;font-size:12px;letter-spacing:2px;font-weight:700;color:var(--dim)}
.slip .when{text-align:center;font-size:11.5px;color:var(--dim);margin-top:4px}
.stamp{position:absolute;right:20px;top:18px;transform:rotate(-10deg);border:2px solid var(--get);color:var(--get);padding:4px 14px;border-radius:12px;font-family:var(--serif);font-weight:800;font-size:18px;letter-spacing:3px;opacity:.9;animation:stamp .5s cubic-bezier(.2,1.2,.4,1) .25s both;pointer-events:none}
.paid-title{font-family:var(--serif);font-weight:700;font-size:28px;line-height:1.15;margin-top:6px}
.paid-title i{color:var(--dim);font-style:normal}

/* share */
.sharecard{width:100%;display:block;margin-bottom:16px;border-radius:20px;box-shadow:var(--shadow)}
.share-note{font-size:13px;color:var(--dim);text-align:center;margin-top:12px}

/* settings */
.set-row{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:12px 0;border-bottom:1px solid var(--hair)}
.set-row:last-child{border-bottom:none}
.set-row .k{font-weight:600;font-size:15px;display:flex;align-items:center;gap:8px}
.set-row .v{color:var(--dim);font-size:13.5px;text-align:right}
.lang-seg{display:flex;gap:8px;flex-wrap:wrap;justify-content:flex-end}
.note{font-size:12.5px;color:var(--dim);margin-top:10px;line-height:1.5}

/* pro */
.pro-hero{border:1px solid var(--warn-bd);border-radius:24px;padding:24px 22px;text-align:center;margin-bottom:18px;background:var(--warn-bg)}
.pro-hero .star{display:flex;justify-content:center;color:var(--warn)}
.pro-hero h2{font-family:var(--serif);font-weight:700;font-size:24px;margin:8px 0 4px}
.pro-feat{display:flex;gap:12px;align-items:flex-start;padding:10px 0;border-bottom:1px solid var(--hair)}
.pro-feat:last-child{border-bottom:none}
.pro-feat .ic{flex:none;margin-top:1px;color:var(--warn)}
.pro-feat b{font-size:14.5px;font-weight:600}
.price{display:flex;align-items:center;justify-content:space-between;gap:10px;background:var(--paper);border:1px solid var(--line);border-radius:18px;padding:14px 16px;margin-bottom:10px}
.price .p b{font-family:var(--serif);font-size:16px}
.best{font-size:10.5px;font-weight:700;color:var(--get);border:1px solid currentColor;padding:2px 8px;margin-left:8px;letter-spacing:1px;border-radius:999px}

/* new trip */
.emo-row{display:flex;flex-wrap:wrap;gap:8px}
.emo{width:46px;height:46px;border:1px solid var(--line);border-radius:14px;background:var(--paper);font-size:22px;cursor:pointer;display:flex;align-items:center;justify-content:center}
.emo.on{border-color:var(--accent);box-shadow:0 0 0 2px var(--accent)}

/* modal + toast */
.mback{position:fixed;inset:0;background:rgba(5,6,8,.62);z-index:40;display:flex;align-items:flex-end;justify-content:center;animation:fadein .15s ease both}
@keyframes fadein{from{opacity:0}to{opacity:1}}
.mcard{width:100%;max-width:464px;background:var(--paper);border-top:1px solid var(--line);border-radius:28px 28px 0 0;padding:14px 18px calc(22px + env(safe-area-inset-bottom));animation:slideup .22s ease both;max-height:88dvh;overflow-y:auto}
.mcard::before{content:"";display:block;width:44px;height:5px;border-radius:3px;background:var(--line);margin:0 auto 14px}
@keyframes slideup{from{transform:translateY(40px);opacity:.4}to{transform:none;opacity:1}}
.mtitle{font-family:var(--serif);font-size:18px;font-weight:700;margin-bottom:8px}
.mbody{color:var(--dim);font-size:14.5px;margin-bottom:18px;word-break:break-word}
.mbody b{color:var(--ink)}
.mactions{display:flex;gap:10px}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(96px + env(safe-area-inset-bottom));background:var(--ink);color:var(--bg);font-size:14px;font-weight:600;padding:11px 18px;border-radius:14px;z-index:60;box-shadow:var(--shadow);animation:fadeup .2s ease both;max-width:88vw;text-align:center}
.welcome{padding-top:9vh;text-align:left}
.welcome .wordmark{font-size:44px;display:block;margin-bottom:22px}
.welcome h1{font-family:var(--serif);font-weight:700;font-size:30px;line-height:1.15;margin-bottom:10px}
.welcome .sub{color:var(--dim);margin-bottom:26px;font-size:15px}
.steps{text-align:left;margin:0 0 26px;background:var(--paper);border:1px solid var(--line);border-radius:22px;padding:8px 18px}
.step{display:flex;gap:12px;align-items:center;padding:12px 0;border-bottom:1px solid var(--hair)}
.step:last-child{border-bottom:none}
.step .n{font-family:var(--serif);font-weight:800;font-size:13px;flex:none;width:24px;color:var(--accent)}
.step p{font-size:14.5px;color:var(--ink2)}
.step p b{color:var(--ink)}

/* UPI, insights, itemized */
.fact{display:flex;gap:6px;grid-column:1/-1;justify-content:flex-end}
.upi-in{display:block;width:100%;margin-top:6px;background:var(--field);border:1px solid var(--line);border-radius:12px;color:var(--ink);padding:8px 10px;font-size:13px;outline:none;min-height:38px;font-family:var(--sans)}
.upi-in:focus{border-color:var(--accent)}
.upi-in.bad{border-color:var(--owe)}
.bstrip{cursor:pointer;padding:12px 16px}
.bar{height:8px;background:var(--paper2);overflow:hidden;margin-top:6px;border-radius:4px}
.bar.big{height:12px;border-radius:6px}
.bar.thin{height:5px;margin-top:5px}
.bar i{display:block;height:100%;background:var(--accent);border-radius:inherit}
.bar.cat i{background:var(--accent)}
.bar.warn i{background:var(--warn)}
.bar.over i{background:var(--owe)}
.bar.used i{background:var(--faint)}
.lg{display:inline-block;width:9px;height:9px;border-radius:3px;margin:0 4px 0 8px;vertical-align:middle;background:var(--accent)}
.lg.used{background:var(--faint)}
.irow{display:flex;align-items:center;gap:11px;padding:9px 0;border-bottom:1px solid var(--hair)}
.irow:last-child{border-bottom:none}
.irow .ic{width:24px;flex:none;display:flex;justify-content:center;color:var(--ink2)}
.stmt{display:grid;grid-template-columns:minmax(0,1.3fr) repeat(2,minmax(0,1fr));gap:8px 10px;font-size:13px;font-variant-numeric:tabular-nums}
.stmt .h{font-size:10.5px;letter-spacing:1.2px;color:var(--dim)}
.stmt .r{text-align:right}
.days{display:flex;gap:8px;align-items:flex-end;overflow-x:auto;padding-bottom:4px}
.dcol{flex:1;min-width:40px;display:flex;flex-direction:column;align-items:center;gap:4px}
.dbar{height:96px;width:100%;display:flex;align-items:flex-end}
.dbar i{display:block;width:100%;background:var(--paper2);border-radius:8px 8px 3px 3px}
.dcol:last-child .dbar i{background:var(--accent)}
.dv{font-size:10.5px;color:var(--ink);white-space:nowrap}
.dl{font-size:10px;color:var(--dim);white-space:nowrap;text-transform:uppercase}
.itm{padding:10px 0;border-bottom:1px solid var(--hair)}
.itm .iname{padding:9px 11px;font-size:14px}
.iwho{display:flex;flex-wrap:wrap;gap:5px;margin-top:8px}
.ich{min-width:34px;height:30px;border:1px dashed var(--line);border-radius:10px;background:transparent;color:var(--dim);font-size:11px;font-weight:700;cursor:pointer;padding:0 8px;font-family:var(--sans)}
.ich.on{background:var(--ink);border:1px solid var(--ink);color:var(--bg)}
.ich.all{border-style:solid;color:var(--ink);display:flex;align-items:center;justify-content:center}
.rcpt-banner{display:flex;align-items:center;gap:8px;width:100%;text-align:left;background:var(--get-bg);border:1px solid var(--get-bd);border-radius:14px;color:var(--get);font-weight:700;font-size:13.5px;padding:10px 12px;margin-bottom:12px;cursor:pointer;font-family:var(--sans);min-height:44px}
/* live sync */
.invite-strip{display:flex;align-items:center;gap:12px;padding:12px 16px}
.icode{font-size:16px;font-weight:700;letter-spacing:1.5px;margin-top:2px}
.bigcode{font-family:var(--serif);font-size:26px;font-weight:700;letter-spacing:2px;text-align:center;padding:18px 0 8px;color:var(--ink)}
.spill{display:inline-flex;align-items:center;gap:5px;font-weight:600}
.spill i{width:7px;height:7px;border-radius:50%;background:var(--faint);display:inline-block}
.spill.live i{background:var(--get)} .spill.live{color:var(--get)}
.spill.saving i,.spill.connecting i{background:var(--warn)}
.spill.offline i{background:transparent;border:1.5px solid var(--dim)}
.spill.error,.spill.removed{color:var(--owe)} .spill.error i,.spill.removed i{background:var(--owe)}
.sync-card b{font-family:var(--serif);font-weight:700;font-size:15px}
.sync-card.warn{border-color:var(--owe-bd)}
.pickrow{display:flex;align-items:center;gap:12px;width:100%;background:none;border:none;border-bottom:1px solid var(--hair);padding:14px 0;color:var(--ink);font-family:var(--sans);font-size:16px;cursor:pointer;text-align:left;min-height:56px}
.pickrow:last-child{border-bottom:none}
.pickrow:active{background:var(--paper2)}

/* ---------- voice bill ---------- */
.vwrap{position:fixed;inset:0;z-index:45;background:var(--bg);display:flex;justify-content:center;animation:fadein .15s ease both}

<div class="wrap" id="app">
  <div id="screen"></div>
  <div id="modalRoot"></div>
  <div id="voiceRoot"></div>
  <div id="dockRoot"></div>
  <div id="toastRoot"></div>

<script>
/* =====================================================
   BILLO — just send the bills
   Pure logic first (unit-testable, no DOM), UI below.
   ===================================================== */
'use strict';

const APP = {
  name: 'Billo',
  pkg: 'com.billo.app',
  tagline: "Just send the bills. We'll do the math.",
  storeUrl: 'https://play.google.com/store/apps/details?id=com.billo.app',
  webUrl: 'billo.app',
  version: '1.6.4'
};

const CATS = {
  food:   { label: 'Food',     emoji: '🍽️' },
  cab:    { label: 'Cab',      emoji: '🚕' },
  hotel:  { label: 'Hotel',    emoji: '🏨' },
  travel: { label: 'Travel',   emoji: '✈️' },
  fuel:   { label: 'Fuel',     emoji: '⛽' },
  shop:   { label: 'Shopping', emoji: '🛍️' },
  health: { label: 'Health',   emoji: '💊' },
  fun:    { label: 'Activity', emoji: '🎟️' },
  gift:   { label: 'Gift',     emoji: '🎁' },
  other:  { label: 'Other',    emoji: '📎' }
};

const EMOJIS = ['🏖️','🏔️','🏙️','🎉','✈️','🏍️','🎳','🏠','🌊','⛰️','🛕','🎬','🚂','🏕️','🎮','📿'];

const CURRENCIES = ['INR','USD','EUR','GBP','AED','SGD','JPY','AUD','CAD','CHF','KWD','QAR'];

const round2 = n => Math.round(n * 100) / 100;
const uid = p => (p || 'x') + Date.now().toString(36) + Math.random().toString(36).slice(2, 7);
const escapeRe = s => String(s).replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
const escapeHtml = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const titleCase = s => String(s).replace(/\b\w/g, c => c.toUpperCase());

function fmtMoney(n, cur) {
  cur = cur || 'INR';
  n = round2(Number(n) || 0);
  try {
    return new Intl.NumberFormat(cur === 'INR' ? 'en-IN' : undefined, {
      style: 'currency', currency: cur, minimumFractionDigits: Number.isInteger(n) ? 0 : 2, maximumFractionDigits: 2
    }).format(n);
  } catch (e) { return '₹' + n.toFixed(2); }
}

function todayStr() {
  const d = new Date();
  return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0');
}

function dayLabel(dateStr, lang) {
  if (!dateStr) return '';
  const today = todayStr();
  const y = new Date(); y.setDate(y.getDate() - 1);
  const yest = y.getFullYear() + '-' + String(y.getMonth() + 1).padStart(2, '0') + '-' + String(y.getDate()).padStart(2, '0');
  if (dateStr === today) return lang === 'hi' ? 'आज' : 'Today';
  if (dateStr === yest) return lang === 'hi' ? 'कल' : 'Yesterday';
  try {
    return new Date(dateStr + 'T00:00:00').toLocaleDateString(lang === 'hi' ? 'hi-IN' : 'en-IN', { day: 'numeric', month: 'short' });
  } catch (e) { return dateStr; }
}

function meIdOf(trip) {
  const m = (trip.members || []).find(m => m.self) || (trip.members || [])[0];
  return m ? m.id : null;
}
function memberById(trip, id) { return (trip.members || []).find(m => m.id === id) || null; }
function displayName(trip, m, meName) { return m ? (m.self ? ((meName || m.name) || 'You') : (m.name || '?')) : '?'; }

/* Split an amount into exact paise across ids. */
function splitEqual(amount, ids) {
  const paise = Math.round((Number(amount) || 0) * 100);
  const n = (ids || []).length;
  const out = {};
  if (!n) return out;
  const base = Math.floor(paise / n), rem = paise % n;
  ids.forEach((id, i) => { out[id] = Math.round(base + (i < rem ? 1 : 0)) / 100; });
  return out;
}

/* Core ledger: net per person ( + = to collect, - = to pay ) + minimal set of settlement flows. */
function computeTrip(trip) {
  const net = {}, spent = {};
  trip.members.forEach(m => { net[m.id] = 0; spent[m.id] = 0; });
  let total = 0, openCount = 0, receipts = 0;
  for (const e of trip.expenses || []) {
    if (e.img || e.src === 'photo') receipts++;
    if (e.settled) continue;
    openCount++; total = round2(total + e.amount);
    net[e.payerId] = round2((net[e.payerId] || 0) + e.amount);
    const sh = (e.custom && e.customAmts) ? e.customAmts : splitEqual(e.amount, e.parts);
    for (const pid in sh) {
      if (!(pid in net)) net[pid] = 0;
      net[pid] = round2(net[pid] - sh[pid]);
      spent[pid] = round2(spent[pid] + sh[pid]);
    }
  }
  for (const p of trip.payments || []) {
    if (!(p.from in net)) net[p.from] = 0;
    if (!(p.to in net)) net[p.to] = 0;
    net[p.from] = round2(net[p.from] + p.amount);
    net[p.to] = round2(net[p.to] - p.amount);
  }
  const debtors = [], creditors = [];
  trip.members.forEach(m => {
    if (net[m.id] < -0.004) debtors.push({ id: m.id, left: -net[m.id] });
    else if (net[m.id] > 0.004) creditors.push({ id: m.id, left: net[m.id] });
  });
  debtors.sort((a, b) => b.left - a.left);
  creditors.sort((a, b) => b.left - a.left);
  const flows = [];
  let i = 0, j = 0;
  while (i < debtors.length && j < creditors.length) {
    const d = debtors[i], c = creditors[j], amt = Math.min(d.left, c.left);
    if (amt > 0.004) flows.push({ from: d.id, to: c.id, amount: round2(amt) });
    d.left = round2(d.left - amt); c.left = round2(c.left - amt);
    if (d.left <= 0.004) i++;
    if (c.left <= 0.004) j++;
  }
  let outstanding = 0;
  trip.members.forEach(m => { if (net[m.id] < 0) outstanding += -net[m.id]; });
  return { net, flows, total, openCount, receipts, spent, outstanding: round2(outstanding) };
}

/* ---------- on-device "AI expense inbox" parser ---------- */
/* Whole-word matching only. Substring matching used to mis-file bills whenever a
   keyword happened to sit inside a longer word — an OCR'd cafe receipt reading
   "Koramangala" matched "ola" and became a cab. A trailing "s?" keeps plurals working. */
const catRe = words => new RegExp('(?:^|[^a-z0-9])(?:' + words.join('|') + ')s?(?![a-z0-9])', 'i');
const CAT_RULES = [
  [catRe(['cab', 'taxi', 'uber', 'ola', 'rapido', 'auto rick', 'auto', 'ride', 'scooty', 'scooter', 'bike rental', 'e-rick']), 'cab'],
  [catRe(['hotel', 'airbnb', 'stay', 'room', 'guest ?house', 'hostel', 'resort', 'leisure', 'booking\\.com', 'oyo']), 'hotel'],
  [catRe(['dinner', 'lunch', 'breakfast', 'food', 'restaurant', 'resturant', 'cafe', 'caf\u00e9', 'eat', 'khana', 'ziya', 'snack', 'chai', 'coffee', 'biriyani', 'biryani', 'pizza', 'burger', 'thali', 'momo', 'juice', 'bar', 'meal', 'booze', 'beer', 'wine', 'liquor', 'whisky', 'vodka', 'champagne', 'cocktail', 'zomato', 'swiggy']), 'food'],
  [catRe(['train', 'flight', 'bus', 'indigo', 'vistara', 'irctc', 'air ?ticket', 'ticket', 'scoot', 'spicejet', 'go first', 'aeroflight']), 'travel'],
  [catRe(['fuel', 'petrol', 'diesel', 'hpcl', 'ipcl', 'bpcl', 'dhaba']), 'fuel'],
  [catRe(['shop', 'shopping', 'bazaar', 'market', 'store', 'mall', 'souvenir shop', 'gift shop', 'clothes', 'clothing']), 'shop'],
  [catRe(['medicine', 'pharmacy', 'doctor', 'hospital', 'dabba', 'apollo', '1mg']), 'health'],
  [catRe(['activity', 'safari', 'waterfall', 'zipline', 'paragliding', 'caving', 'trek', 'trekking', 'outing', 'show', 'movie', 'cinema', 'amusement', 'park', 'river rafting', 'rafting', 'hot air balloon', 'balloon']), 'fun'],
  [catRe(['gift', 'souvenir', 'present', 'diya', 'puja', 'flower']), 'gift']
];

/* Drop a single leading separator that the "not inside a word" guard consumed. */
const trimAmtLead = m => /^[^0-9₹a-z]/i.test(m) ? m.slice(1) : m;

function parseExpenseText(text, trip, meName) {
  const t = String(text || '').trim();
  const low = t.toLowerCase();
  const me = meIdOf(trip) || (trip.members[0] && trip.members[0].id);
  const r = { amount: 0, amStr: '', desc: '', cat: null, payerId: null, payerFound: false, parts: [], partsFound: false, everyone: false, onlyMe: false, conf: 0, raw: t, date: null };
  if (!t || !trip.members.length) return r;

  /* amount */
  let am = t.match(/(?:^|[^a-z0-9])(?:₹|rs\.?|inr)\s*([0-9][0-9,]{0,12}(?:\.[0-9]{1,2})?)(\s*(?:k\.?| thousand))?/i)
       || t.match(/([0-9][0-9,]{0,12}(?:\.[0-9]{1,2})?)\s*(k\.?| thousand|rupees?|₹|rs\.?|inr)\b/i)
       || t.match(/\b([0-9][0-9,]{0,12}(?:\.[0-9]{1,2})?)\b/);
  if (am) {
    let v = parseFloat(am[1].replace(/,/g, ''));
    if (am[2] && am[2].toLowerCase().indexOf('k') === 0) v *= 1000;
    /* the leading-delimiter guard may have swallowed one separator char — don't
       report it as part of the amount text (amStr is stripped from the description) */
    r.amount = round2(v); r.amStr = trimAmtLead(am[0]);
  }

  /* who paid (detected first so the participants logic can exclude the payer's name) */
  const names = trip.members.map(m => ({ id: m.id, re: new RegExp('\\b' + escapeRe(displayName(trip, m, meName)) + '\\b', 'i') }));
  const findMember = nm => {
    if (!nm) return null;
    const dn0 = String(nm).toLowerCase();
    return trip.members.find(m => {
      const dn = displayName(trip, m, meName).toLowerCase();
      return dn === dn0 || dn.indexOf(dn0) === 0 || dn0.indexOf(dn) === 0 || dn.indexOf(dn0) > 0;
    }) || null;
  };
  {
    const kwm = low.search(/\b(paid|diya|bharaya|di)\b/);
    if (kwm >= 0) {
      const before = low.slice(0, kwm).trim().split(/\s+/).filter(Boolean)
        .filter(w => !/^(had|has|have|just|only|please|₹|\d[\d,.]*)$/.test(w));
      const cand1 = before.length ? before[before.length - 1] : '';
      const cand2 = before.length >= 2 ? before[before.length - 2] + ' ' + before[before.length - 1] : '';
      if (/^(i|me|my|maine|humne|hum)$/.test(cand1)) { r.payerId = me; r.payerFound = true; }
      else {
        const f1 = findMember(cand1);
        const f2 = f1 ? null : findMember(cand2);
        if (f1) { r.payerId = f1.id; r.payerFound = true; }
        else if (f2) { r.payerId = f2.id; r.payerFound = true; }
      }
    }
  }
  if (!r.payerId) {
    if (/\b(?:i|me)\s+(?:had\s+|has\s+)?paid\b/.test(low) || /maine/.test(low)) { r.payerId = me; r.payerFound = true; }
    else r.payerId = me;
  }

  /* who is involved */
  if (/\b(only|just|sirf)\s+(for\s+|mere\s+)?(me|myself)\b/.test(low) || /\bpersonal\b/.test(low) || /sirf mere/.test(low)) {
    r.onlyMe = true; r.parts = [me]; r.partsFound = true;
  } else if (/\bfor\s+(everyone|all of you|all of us|all|us|the group|whole group|group)\b/.test(low) || /\bsab\b/.test(low) || /sab\s*(ke|ko)?\s*liye/.test(low) || /\bpoora group\b/.test(low)) {
    r.everyone = true; r.parts = trip.members.map(m => m.id); r.partsFound = true;
  } else {
    const found = [];
    const scope = low.match(/\b(?:for|with|between|to|me and)\s+([a-z0-9][a-z0-9 ,&]*(?:\b[a-z]{2,}))?\s*(?:\s+(?:on|at|in|for|paid|bill|receipt|the)\b|$)/);
    const scopeTxt = scope && scope[1] ? scope[1] : '';
    const hasMe = scopeTxt ? /\b(me|i)\b/.test(scopeTxt) : false;
    let usedScope = false;
    if (scopeTxt) {
      names.forEach(n => { if (n.re.test(scopeTxt) && found.indexOf(n.id) === -1) found.push(n.id); });
      if (hasMe && found.indexOf(me) === -1) found.push(me);
      if (found.length) usedScope = true;
    }
    if (!usedScope) {
      names.forEach(n => {
        if (n.id === r.payerId) return; /* the payer's name is usually the "X paid" role */
        if (n.re.test(low) && found.indexOf(n.id) === -1) found.push(n.id);
      });
    }
    if (found.length) { r.parts = found; r.partsFound = true; }
    else { r.parts = trip.members.map(m => m.id); r.everyone = true; }
  }
  if (!r.parts.includes(r.payerId) && !r.onlyMe) r.parts.unshift(r.payerId);
  if (r.partsFound && r.payerId === me && r.parts.indexOf(me) === -1) r.parts.unshift(me);

  /* category */
  for (const rule of CAT_RULES) { if (rule[0].test(low)) { r.cat = rule[1]; break; } }
  if (!r.cat) r.cat = 'other';

  /* description: strip amount, keywords, names, numbers */
  let s = ' ' + t + ' ';
  if (r.amStr) s = s.split(r.amStr).join(' ');
  const payerName = displayName(trip, memberById(trip, r.payerId), meName);
  if (payerName) s = s.replace(new RegExp('\\b' + escapeRe(payerName) + '\\b', 'gi'), ' ');
  /* names never belong in a bill's description ("Food Sid" → "Food") */
  (trip.members || []).forEach(m => [m.name, displayName(trip, m, meName)].forEach(n => { if (n && n.length > 1) s = s.replace(new RegExp('\\b' + escapeRe(n) + '\\b', 'gi'), ' '); }));
  s = s.replace(/\b(between|split|equally|each|both|rupees?|rupaye|bucks|saath|aur|diye|bhi|also|everybody|people|guys)\b/gi, ' ').replace(/[.,!?;:&+()]/g, ' ');
  s = s.replace(/\b(i|me|my|we|us|the|a|an|and|with|for|of|to|on|at|in|it|its|was|is|by|had|has|have|paid|billed|bill|bills|receipt|invoice|upi|screenshot|pic|image|photo|ne|ki|ke|ko|se|liye|liya|di|diya|maine|sab|sabbr|everyone|all|just|only|sirf|myself|google|pay|payment|transaction|transactions|successful|success|reference|ref|id|charged|cashback|fee|date|time|january|february|march|april|june|july|august|september|october|november|december|jan|feb|mar|apr|may|jun|jul|aug|sep|oct|nov|dec|am|pm)\b/gi, ' ');

  if (s.length > 42) s = '';

  r.conf = (r.amount ? 1 : 0) + (r.payerFound ? 1 : 0) + (r.partsFound ? 1 : 0);
  return r;
}

/* ---------- multiple expenses in one message ---------- */
function cutIndex(t, a, b) {
  const region = t.slice(a, b);
  const conn = region.match(/\s(?:and|&|plus|aur)\s+|\s[,;]\s/);
  if (conn) {
    const at = region.indexOf(conn[0]);
    return a + at + conn[0].length;
  }
  const mid = (a + b) / 2;
  let best = -1, bestD = Infinity;
  for (let i = a + 1; i < b; i++) {
    if (t[i] !== ' ') continue;
    const d = Math.abs(i - mid);
    if (d < bestD || (d === bestD && i > best)) { bestD = d; best = i; }
  }
  return best === -1 ? Math.floor(mid) : best;
}

/* Parse one or many expenses from a message ("I paid 2200 for booze and 1388 for food"). */
function parseExpenseTextAll(text, trip, meName) {
  const t = String(text || '').trim();
  if (!t || !trip.members.length) return [parseExpenseText(t, trip, meName)];
  const re = /(?:^|[^a-z0-9])(?:₹|rs\.?|inr)\s*([0-9][0-9,]{0,12}(?:\.[0-9]{1,2})?)(\s*(?:k\.?| thousand))?|\b([0-9][0-9,]{0,12}(?:\.[0-9]{1,2})?)\s*(k\.?| thousand|rupees?|₹|rs\.?|inr)\b|\b([0-9][0-9,]{0,12}(?:\.[0-9]{1,2})?)\b/g;
  const amounts = [];
  let m;
  while ((m = re.exec(t)) !== null && amounts.length < 8) {
    let raw, k = '';
    if (m[1] != null) { raw = m[1]; k = m[2] || ''; }
    else if (m[3] != null) { raw = m[3]; k = m[4] || ''; }
    else { raw = m[5]; }
    let v = parseFloat(String(raw).replace(/,/g, ''));
    const isK = k.toLowerCase().indexOf('k') === 0;
    if (isK) v *= 1000;
    const lead = m[0].length - trimAmtLead(m[0]).length; /* keep offsets on the amount itself */
    amounts.push({ start: m.index + lead, end: m.index + m[0].length, value: round2(v), strong: m[1] != null || isK });
  }
  let isMulti = false;
  if (amounts.length >= 2) {
    if (amounts.filter(a => a.strong).length >= 2) isMulti = true;
    else {
      for (let i = 0; i + 1 < amounts.length && !isMulti; i++) {
        const between = t.slice(amounts[i].end, amounts[i + 1].start);
        if (/(?:^|\s)(?:and|&|plus|aur)(?:\s|$)/i.test(between) || /\s[,;]\s/.test(between) || between.trim() === '+') isMulti = true;
      }
    }
  }
  if (!isMulti) return [parseExpenseText(t, trip, meName)];
  const cuts = [0];
  for (let i = 1; i < amounts.length; i++) cuts.push(cutIndex(t, amounts[i - 1].end, amounts[i].start));
  const results = [];
  for (let i = 0; i < amounts.length; i++) {
    const s = cuts[i];
    const e = i + 1 < amounts.length ? cuts[i + 1] : t.length;
    let seg = t.slice(s, e);
    seg = seg.replace(/\s+(?:and|&|plus|aur|[,;])\s*$/i, '').trim();
    const r = parseExpenseText(seg, trip, meName);
    r.amount = amounts[i].value;
    results.push(r);
  }
  for (let i = 1; i < results.length; i++) {
    if (!results[i].payerFound) {
      for (let j = i - 1; j >= 0; j--) {
        if (results[j].payerFound) { results[i].payerId = results[j].payerId; break; }
      }
    }
  }
  return results;
}

/* ---------- pattern learning (Level 2 of the spec) ---------- */
const partsKey = ids => (ids || []).slice().sort().join('+');
function learnRecord(trip, e) {
  trip.learn = trip.learn || {};
  const k = e.payerId + '|' + e.cat;
  const pk = partsKey(e.parts);
  trip.learn[k] = trip.learn[k] || {};
  trip.learn[k][pk] = (trip.learn[k][pk] || 0) + 1;
}
function learnSuggest(trip, payerId, cat) {
  const m = (trip.learn || {})[payerId + '|' + cat];
  if (!m) return null;
  let total = 0, top = null, topC = 0;
  for (const pk in m) { total += m[pk]; if (m[pk] > topC) { topC = m[pk]; top = pk; } }
  if (total >= 3 && topC / total >= 0.6 && top) {
    const ids = top.split('+').filter(id => memberById(trip, id));
    if (ids.length) return { ids, hint: 'learned' };
  }
  return null;
}

/* ---------- shareable summary ---------- */
/* "per person" only means something when every bill was split equally between everyone */
/* the icon for a bill: its category, unless its name is another category's name ("Food" saved as Other) */
function billName(e) {
  const d = (e && e.desc) || '';
  const lab = e && e.cat && e.cat !== 'other' && CATS[e.cat] ? CATS[e.cat].label : 'Bill';
  /* older versions saved the word "Other" as the name of unnamed bills */
  /* …and leftovers like "I Paid" from voice */
  const junk = /^(?:other|(?:i|me|we|maine|hum|humne)?\s*(?:paid|pay|payed|diya|diye|de\s*diya)?)$/i;
  return d && !junk.test(d.trim()) ? d : lab;
}

  if (byLabel && byLabel !== 'other') return byLabel;

}

}

  const nm = id => { const m = memberById(trip, id); return m ? displayName(trip, m, meName) : '?'; };

  const amt = n => fmtMoney(trip.currency === 'INR' ? Math.round(Number(n) || 0) : n, trip.currency);
  const L = [];
  L.push(trip.name + ' — ' + amt(calc.total));
  const n = trip.members.length;
  L.push(n + ' ' + (n === 1 ? 'person' : 'people') + ' · ' + (trip.expenses.length) + ' bills' + (n && evenSplit(trip) ? ' · ' + amt(calc.total / n) + ' each' : ''));
  L.push('');
  if (calc.flows.length) {
    L.push('Who pays whom:');
    calc.flows.forEach(f => L.push('• ' + nm(f.from) + ' → ' + nm(f.to) + ' ' + amt(f.amount)));
    const seen = {};
    const upi = calc.flows.map(f => memberById(trip, f.to)).filter(m => m && isVpa(m.upi) && trip.currency === 'INR' && !seen[m.id] && (seen[m.id] = 1));
    if (upi.length) {
      L.push('');
      upi.forEach(m => L.push('Pay ' + displayName(trip, m, meName) + ' on UPI: ' + m.upi.trim().toLowerCase()));
    }

    L.push("Everyone's settled up");
  }

}
/* ---------- UPI settle-up ---------- */
/* A UPI ID (VPA) is handle@provider, e.g. rahul.k@okaxis, 9876543210@ybl. */
const VPA_RE = /^[a-z0-9][a-z0-9._-]{1,255}@[a-z][a-z0-9]{1,63}$/i;

function upiLink(o) {

  if (!isVpa(vpa)) return '';
  const q = ['pa=' + encodeURIComponent(vpa)];
  if (o.name) q.push('pn=' + encodeURIComponent(String(o.name).slice(0, 40)));
  const am = round2(Number(o.amount) || 0);

function buildUpiRequest(trip, flow, meNm) {
  const from = memberById(trip, flow.from), to = memberById(trip, flow.to);
  const L = [];
  L.push('Hi ' + displayName(trip, from, meNm) + ',');
  L.push('Settling up ' + trip.name + ': you owe ' + displayName(trip, to, meNm) + ' ' + fmtMoney(trip.currency === 'INR' ? Math.round(flow.amount) : flow.amount, trip.currency) + '.');
  if (to && isVpa(to.upi)) L.push('UPI: ' + to.upi.trim().toLowerCase());
  L.push('');
  L.push('— sent from ' + APP.name + ' · ' + APP.storeUrl);

/* ---------- itemized split ---------- */
/* items: [{ name, price, who: [memberIds] }]. extra: tax / service / tip (+) or discount (−),
   spread in proportion to what each person ordered. Paise-exact: shares always sum to amount. */
function splitItems(items, extra) {
  const P = {};
  let sub = 0;
  for (const it of items || []) {
    const p = Math.round((Number(it.price) || 0) * 100);
    const who = (it.who || []).filter(Boolean);
    if (p <= 0 || !who.length) continue;
    const base = Math.floor(p / who.length), rem = p % who.length;
    who.forEach((id, i) => { P[id] = (P[id] || 0) + base + (i < rem ? 1 : 0); });
    sub += p;
  }
  let ex = Math.round((Number(extra) || 0) * 100);
  if (sub <= 0) return { amount: 0, subtotal: 0, extra: 0, shares: {} };
  if (sub + ex < 0) ex = -sub;
  if (ex) {
    const ids = Object.keys(P);
    const raw = ids.map(id => ex * P[id] / sub);
    const fl = raw.map(Math.floor);
    let left = ex - fl.reduce((s, v) => s + v, 0);
    const order = ids.map((id, i) => i).sort((a, b) => (raw[b] - fl[b]) - (raw[a] - fl[a]));
    for (let k = 0; k < order.length && left > 0; k++, left--) fl[order[k]]++;
    ids.forEach((id, i) => { P[id] += fl[i]; });
  }
  const shares = {};
  for (const id in P) shares[id] = P[id] / 100;
  return { amount: (sub + ex) / 100, subtotal: sub / 100, extra: ex / 100, shares };
}

/* Pull line items out of OCR'd receipt text. Returns null unless it finds ≥ 2 believable items. */
const RCPT_SKIP = /\b(sub\s*-?\s*total|grand\s*total|total|net\s*(?:amt|amount|payable)|amount\s*(?:due|payable|paid)|balance|cash|change|card|upi|paid|tender|round(?:ing|ed)?\s*off|bill\s*no|invoice|inv\s*no|table|covers?|pax|date|time|gstin|fssai|phone|ph|tel|mob(?:ile)?|order\s*no|kot|cashier|server|steward|thank|visit)\b/i;
const RCPT_TAX = /\b(c\s*gst|s\s*gst|i\s*gst|gst|vat|tax|service\s*(?:charge|chg|tax)?|svc|s\.?\s*c\.?|tip|packing|packaging|delivery|convenience|platform\s*fee)\b/i;

const RCPT_TOTAL = /\b(grand\s*total|net\s*(?:amt|amount|payable)|amount\s*payable|total\s*(?:amount|payable|due)?)\b/i;
function parseReceiptItems(text) {
  const lines = String(text || '').split(/\r?\n/).map(s => s.replace(/\s+/g, ' ').trim()).filter(Boolean);
  const items = [];
  let extra = 0, total = 0;
  for (const ln of lines) {
    if (/\d{1,2}[\/.-]\d{1,2}[\/.-]\d{2,4}|\d{1,2}:\d{2}/.test(ln)) continue; /* dates / times */
    const m = ln.match(/^(.*?)[\s:]*(?:₹|rs\.?|inr)?\s*(-?[0-9][0-9,]*(?:\.[0-9]{1,2})?)\s*$/i);
    if (!m) continue;
    let name = m[1].trim();
    const v = parseFloat(m[2].replace(/,/g, ''));
    if (!(Math.abs(v) > 0) || Math.abs(v) >= 100000) continue;
    const letters = (name.match(/[a-z]/gi) || []).length;
    if (letters < 2) continue;
    if (RCPT_TOTAL.test(name) && !/sub/i.test(name)) { total = Math.max(total, Math.abs(v)); continue; }
    if (RCPT_DISC.test(name)) { extra -= Math.abs(v); continue; }
    if (RCPT_TAX.test(name)) { if (!/\bincl/i.test(name)) extra += Math.abs(v); continue; }
    if (RCPT_SKIP.test(name)) continue;
    /* "2 x Paneer Tikka @240 480" → name "Paneer Tikka" (price is the line total) */
    name = name.replace(/^\d{1,2}\s*[x×*]?\s+/i, '').replace(/\s*[@x×]\s*[0-9.,]+\s*$/i, '').replace(/\s+\d{1,2}(?:\.0+)?$/, '').replace(/[.:\-–|]+$/, '').trim();
    if (!name || (name.match(/[a-z]/gi) || []).length < 2) continue;
    items.push({ name: titleCase(name.toLowerCase()).slice(0, 40), price: round2(Math.abs(v)) });
  }
  if (items.length < 2) return null;
  const sum = round2(items.reduce((s, it) => s + it.price, 0));
  extra = round2(extra);
  /* Trust a printed total over our tax arithmetic when they disagree, within reason. */
  if (total > 0 && Math.abs(sum + extra - total) > 1) {
    const gap = round2(total - sum);
    if (gap >= -sum * 0.5 && gap <= sum * 0.5) extra = gap;
  }
  return { items, extra, total: total || round2(sum + extra) };
}

/* ---------- trip insights ---------- */
function tripInsights(trip) {
  const byCat = {}, byDay = {}, paid = {}, share = {};
  (trip.members || []).forEach(m => { paid[m.id] = 0; share[m.id] = 0; });
  let total = 0, top = null;
  for (const e of trip.expenses || []) {
    const a = Number(e.amount) || 0;
    total = round2(total + a);
    const c = CATS[e.cat] ? e.cat : 'other';
    byCat[c] = round2((byCat[c] || 0) + a);
    const d = e.date || 'unknown';
    byDay[d] = round2((byDay[d] || 0) + a);
    paid[e.payerId] = round2((paid[e.payerId] || 0) + a);
    const sh = (e.custom && e.customAmts) ? e.customAmts : splitEqual(a, e.parts);
    for (const pid in sh) share[pid] = round2((share[pid] || 0) + (Number(sh[pid]) || 0));
    if (!top || a > top.amount) top = e;
  }
  const cats = Object.keys(byCat).map(k => ({ cat: k, amount: byCat[k], pct: total ? Math.round(byCat[k] * 1000 / total) / 10 : 0 }))
    .sort((a, b) => b.amount - a.amount);
  const days = Object.keys(byDay).sort().map(d => ({ date: d, amount: byDay[d] }));
  const nDays = days.length;
  const perDay = nDays ? round2(total / nDays) : 0;
  let budget = null;
  const B = Number(trip.budget) || 0;
  if (B > 0) {
    const left = round2(B - total);
    const planned = Number(trip.days) || 0;
    budget = {
      budget: B, used: total, left, pct: Math.round(total * 1000 / B) / 10, over: left < 0,
      /* at the current burn rate, where does the trip end up? */
      projected: planned > 0 && nDays >= 2 ? round2(perDay * Math.max(planned, nDays)) : null /* one day of data is not a pace */
    };
  }
  return { total, count: (trip.expenses || []).length, cats, days, nDays, perDay, paid, share, top, budget };
}

/* ---------- live sync (pure part — no DOM, no network; the backend is injected) ----------
   Local state stays the source of what the UI shows. A synced trip mirrors three remote
   collections (meta, expenses, payments). Merging is three-way per document:
     base   = content hash of each doc as last seen from the server (persisted in t.sync.base)
     local  = what the phone has now
     remote = what the server has now

   In base but gone locally → we deleted it → push a tombstone. Never in base → theirs, keep it. */

const SYNC_EXP_FIELDS = ['id', 'ts', 'desc', 'cat', 'amount', 'currency', 'date', 'payerId', 'parts', 'custom', 'customAmts', 'settled', 'src', 'raw', 'ai', 'items', 'extra'];

function remoteExpense(e) { const r = pickDefined(e, SYNC_EXP_FIELDS); if (typeof r.desc === 'string') r.desc = r.desc.slice(0, 80); if (typeof r.raw === 'string') r.raw = r.raw.slice(0, 500); return r; }

function biggestOwe(cur) {

/* your part of one bill */

/* ---------- voice bills: tap the mic, say it, check it, slide to save ----------
   Android app: the native shell's speech engine (window.Billo.startVoice → window.__billoVoice).
   Browser: the Web Speech API where it exists. Otherwise: type it. */
const VOICE = { rec: null };
function voiceTrip() { const v = ui.voice; return v && (S.trips || []).find(t => t.id === v.tripId) || null; }
function voiceStopRec() {
  try { if (VOICE.rec) VOICE.rec.abort(); } catch (e) {}
  VOICE.rec = null;
  try { if (window.Billo && window.Billo.stopVoice) window.Billo.stopVoice(); } catch (e) {}
}
function voiceClose() {
  voiceStopRec();
  ui.voice = null;
  voiceRender();
}
function voiceListen() {
  const v = ui.voice;
  if (!v) return;
  v.phase = 'listen'; v.err = ''; v.interim = ''; v.text = '';
  voiceRender();
  if (window.Billo && window.Billo.startVoice) {
    try { window.Billo.startVoice('en-IN'); } catch (e) { v.phase = 'type'; voiceRender(); }
    return;
  }
  const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
  if (!SR) { v.phase = 'type'; voiceRender(); return; }
  const r = new SR();
  r.lang = 'en-IN'; r.interimResults = true; r.continuous = false; r.maxAlternatives = 1;
  r.onresult = ev => {
    let fin = '', mid = '';
    for (let i = 0; i < ev.results.length; i++) { const x = ev.results[i]; if (x.isFinal) fin += x[0].transcript; else mid += x[0].transcript; }
    voiceOn(fin ? { type: 'final', text: fin } : { type: 'partial', text: mid });
  };
  r.onerror = ev => voiceOn({ type: 'error', code: ev.error === 'not-allowed' || ev.error === 'service-not-allowed' ? 'perm' : ev.error });
  r.onend = () => voiceOn({ type: 'end' });
  VOICE.rec = r;
  try { r.start(); } catch (e) { voiceOn({ type: 'error', code: 'start' }); }
}
/* events from the Android shell or the browser recogniser */
window.__billoVoice = function (m) {
  try { voiceOn(typeof m === 'string' ? JSON.parse(m) : m); } catch (e) {}
};
function voiceOn(m) {
  const v = ui.voice;
  if (!v || !m) return;
  if (m.type === 'partial') {
    if (v.phase !== 'listen') return;
    v.interim = m.text || '';
    /* only the words change — the screen itself stays put (no flicker while you talk) */
    const el = $('#vsaidTxt');
    if (el) el.textContent = v.interim ? '“' + v.interim + '…”' : ''; else voiceRender();
  }
  else if (m.type === 'final') { if (v.phase !== 'listen') return; v.text = String(m.text || '').trim(); v.interim = ''; VOICE.rec = null; voiceDone(); }
  else if (m.type === 'error') {
    if (v.phase !== 'listen') return;
    if (m.code === 'unavailable') { v.phase = 'type'; voiceRender(); return; }
    v.phase = 'idle';
    v.err = m.code === 'perm' ? T('voice_perm') : m.code === 'no-speech' || m.code === 'nomatch' ? T('voice_none') : T('voice_err');
    voiceRender();
  } else if (m.type === 'end') {
    if (v.phase !== 'listen') return;
    if (v.interim) { v.text = v.interim; v.interim = ''; voiceDone(); }
    else { v.phase = 'idle'; v.err = v.err || T('voice_none'); voiceRender(); }
  }
}
function voiceDone() {
  const v = ui.voice;
  const t = voiceTrip();
  if (!v) return;
  if (!v.text || !t) { v.phase = 'idle'; v.err = T('voice_none'); voiceRender(); return; }
  const norm = voiceNormalize(v.text);
  const all = parseExpenseTextAll(norm, t, S.me.name);
  if (all.length > 1) {
    /* several bills in one breath → the usual review list */
    const said = v.text;
    voiceClose();
    ui.tripId = t.id; ui.editExp = null; ui.addTab = 'say'; ui.doneMulti = null;
    all.forEach(r => { r.raw = r.raw || said; });
    ui.multi = { results: all, selected: all.map(() => true), index: null };
    ui.draft = defaultDraft(t, { raw: said, src: 'text' });
    ui.addStep = 'multi';
    go('add');
    return;
  }
  v.norm = norm;
  v.r = all[0];
  v.newNames = detectNewNames(norm, t, S.me.name);
  v.phase = 'confirm';
  voiceRender();
}
function voiceDraft() {
  const v = ui.voice, t = voiceTrip(), r = v.r;
  return defaultDraft(t, {
    amount: r.amount ? String(r.amount) : '', desc: voiceDesc(r, t, S.me.name, v.newNames), cat: r.cat || 'other',

}

function voiceChips(text, t) {
