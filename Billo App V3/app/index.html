      (first && t.currency === 'INR' ? '<button class="btn btn-ghost" data-act="upi-request" data-arg="' + first.i + '">' + ic('chat', 's') + ' ' + T('remind') + ' ' + escapeHtml(nameOf(t, first.from)) + '</button>' : '') + '</div>';
  }
  return '<div class="card hero"><div class="lbl">' + T('your_balance') + '</div><div class="who">' + T('all_square') + '</div>' +
    '<div class="big">' + fmtMoney(0, t.currency) + '</div><div class="muted">' + (c.flows.length ? T('others_settling', { n: c.flows.length }) : T('no_flows')) + '</div></div>';
}

function scrTrip() {
  const t = curTrip();
  if (!t) return scrHome();
  const c = computeTrip(t);
  const I = tripInsights(t);
  const stat = (v, k, cls, act) => '<div class="stat' + (cls ? ' ' + cls : '') + '"' + (act ? ' data-act="' + act + '" style="cursor:pointer"' : '') + '><div class="v">' + v + '</div><div class="k">' + k + '</div></div>';
  const bud = I.budget;
  const third = bud
    ? stat('<span class="' + (bud.over ? 'neg' : bud.pct > 80 ? '' : '') + '">' + Math.round(bud.pct) + '%</span>', T('budget'), '', 'trip-insights')
    : stat(String(t.expenses.length), T('bills'));
  const sorted = t.members.slice().sort((a, b) => Math.abs(c.net[b.id] || 0) - Math.abs(c.net[a.id] || 0));
  const bal = sorted.map(m => {
    const v = c.net[m.id] || 0;
    let amt, lab;
    if (v > 0.004) { amt = '<div class="bamt pos">+' + fmtMoney(v, t.currency) + '</div>'; lab = T('gets_back'); }
    else if (v < -0.004) { amt = '<div class="bamt neg">−' + fmtMoney(-v, t.currency) + '</div>'; lab = T('needs_pay'); }
    else { amt = '<div class="bamt zero">' + fmtMoney(0, t.currency) + '</div>'; lab = T('settled'); }
    return '<div class="brow">' + avHtml(m, 'sm') + '<div class="binfo" style="flex:1"><b>' + escapeHtml(nameOf(t, m.id)) + (m.self ? ' <span class="muted sm">(' + T('you') + ')</span>' : '') + '</b><div class="muted sm">' + lab + '</div></div>' + amt + '</div>';
  }).join('');
  const meId = meIdOf(t);
  const flowsSorted = c.flows.map((f, i) => Object.assign({ i }, f)).sort((a, b) => (b.from === meId || b.to === meId) - (a.from === meId || a.to === meId));
  const flows = c.flows.length ? flowsSorted.map(f => {
    const fromN = escapeHtml(nameOf(t, f.from)), toN = escapeHtml(nameOf(t, f.to));
    const words = f.from === meId ? T('you_pay_y', { b: toN }) : f.to === meId ? T('pays_you', { a: fromN }) : T('x_pays_y', { a: fromN, b: toN });
    return '<div class="frow' + (f.from === meId ? ' mine' : '') + '"><div class="pair">' + avHtml(memberById(t, f.from), 'sm') + ic('arrow') + avHtml(memberById(t, f.to), 'sm') + '</div>' +
      '<div class="finfo">' + words + '</div><div class="famt">' + fmtMoney(f.amount, t.currency) + '</div>' + flowActions(t, f, f.i) + '</div>';
  }).join('') : '<div class="empty" style="padding:10px 0">' + T('no_flows') + '</div>';
  const pays = (t.payments || []).slice().reverse().map(p =>
    '<div class="prow"><span style="flex:1">' + escapeHtml(nameOf(t, p.from)) + ' → ' + escapeHtml(nameOf(t, p.to)) + (p.via === 'upi' ? ' <span class="muted sm">· UPI</span>' : '') + '</span><span class="mono">' + fmtMoney(p.amount, t.currency) + '</span>' +
    '<button class="mini-link" data-act="unmark-pay" data-arg="' + p.id + '">' + T('undo') + '</button></div>'
  ).join('');
  const payCard = (t.payments || []).length ? '<div class="card"><div class="sec-h"><b>' + T('payments') + '</b></div>' + pays + '</div>' : '';
  let exps;
  if (!t.expenses.length) exps = '<div class="empty">' + T('no_expenses') + '</div>';
  else exps = t.expenses.map(e => {
    let who;
    if (e.parts.length === t.members.length) who = T('everyone');
    else who = e.parts.slice(0, 2).map(id => escapeHtml(nameOf(t, id))).join(', ') + (e.parts.length > 2 ? ' +' + (e.parts.length - 2) : '');
    const mp = myPart(t, e);
    const part = mp.lent > 0.004 ? '<span class="share pos">' + T('you_lent', { a: fmtMoney(mp.lent, t.currency) }) + '</span>'
      : mp.share > 0.004 ? '<span class="share neg">' + T('your_part', { a: fmtMoney(mp.share, t.currency) }) + '</span>'
      : '<span class="share muted">' + T('not_in_it') + '</span>';
    return '<div class="erow" data-act="open-expense" data-arg="' + e.id + '">' +
      '<div class="etile">' + ic(billCat(e)) + '<span class="payer">' + avHtml(memberById(t, e.payerId), 'xs') + '</span></div>' +
      '<div class="einfo"><b>' + escapeHtml(billName(e)) + '</b>' +
      '<span class="meta">' + escapeHtml(nameOf(t, e.payerId)) + ' ' + T('paid_w') + ' · ' + who + ' · ' + dayLabel(e.date, S.settings.lang) +
      (e.items && e.items.length ? ' · ' + T('by_item_w') : '') + (e.img ? ' · ' + T('receipt') : '') + (e.settled ? ' · ' + T('settled') : '') + '</span></div>' +
      '<div class="eside"><span class="eamt">' + fmtMoney(e.amount, t.currency) + '</span>' + part + '</div></div>';
  }).join('') + '<div class="bill-total"><span>' + T('total').toUpperCase() + '</span><span>' + fmtMoney(I.total, t.currency) + '</span></div>';

  return tripHeader(t) + meCheckHtml(t) + syncCard(t) + heroHtml(t, c) + inviteStrip(t) +
    '<div class="stats">' + stat(fmtMoney(I.total, t.currency), T('total')) +
    (evenSplit(t) ? stat(fmtMoney(t.members.length ? I.total / t.members.length : 0, t.currency), T('per_person')) : stat(fmtMoney((I.share || {})[meIdOf(t)] || 0, t.currency), T('your_share_t'))) + third + '</div>' +
    (c.flows.length ? '<div class="card"><div class="sec-h"><b>' + T('settle_up') + '</b><span class="muted sm">' + (c.flows.length === 1 ? T('settle_1') : T('settle_n', { n: c.flows.length })) + '</span></div>' + flows + '</div>' : '') +
    '<div class="card"><div class="sec-h"><b>' + T('balances') + '</b>' +
    '<button class="mini-link" data-act="trip-members">' + t.members.length + ' ' + T('members_btn') + '</button></div>' + bal + '</div>' +
    payCard +
    '<div class="card"><div class="sec-h"><b>' + T('bills_title') + '</b><span class="muted sm">' + t.expenses.length + ' ' + T('bills') + (tripRange(t) ? ' · ' + tripRange(t) : '') + '</span></div>' + exps + '</div>' +
    dockHtml('trip');
}

function flowActions(t, f, i) {
  const me = meIdOf(t);
  let b = '';
  if (t.currency === 'INR' && f.from === me) b += '<button class="btn btn-accent mini" data-act="upi-pay" data-arg="' + i + '">' + T('pay_upi') + '</button>';
  else if (t.currency === 'INR' && f.to === me) b += '<button class="btn btn-ghost mini" data-act="upi-request" data-arg="' + i + '">' + T('remind') + '</button>';
  return '<div class="fact">' + b + '<button class="btn btn-ghost mini" data-act="mark-paid" data-arg="' + i + '" aria-label="' + T('mark_paid') + '" title="' + T('mark_paid') + '">' + ic('check', 's') + '</button></div>';
}
function scrInsights() {
  const t = curTrip();
  if (!t) return scrHome();
  const I = tripInsights(t);
  const head = topBar(iconBtn('insights-back', 'back', T('back')),
    '<div style="min-width:0"><div class="tname">' + T('statement') + '</div><div class="tcode">' + escapeHtml(t.name) + (tripRange(t) ? ' · ' + tripRange(t) : '') + '</div></div>',
    '<div class="top-actions"><button class="btn btn-ghost mini" data-act="set-budget">' + ic('target', 's') + ' ' + T(t.budget ? 'budget' : 'set_budget') + '</button></div>');
  if (!I.count) return head + '<div class="card"><div class="empty">' + T('no_data') + '</div></div>';
  let out = head + '<div class="card">';
  if (I.budget) {
    const b = I.budget;
    out += '<div class="row" style="justify-content:space-between"><span class="lbl">' + T('budget') + '</span><span class="mono sm"><b>' + fmtMoney(b.used, t.currency) + '</b> / ' + fmtMoney(b.budget, t.currency) + '</span></div>' +
      '<div class="bar big' + (b.over ? ' over' : b.pct > 80 ? ' warn' : '') + '" style="margin-top:10px"><i style="width:' + Math.min(100, b.pct) + '%"></i></div>' +
      '<div class="row" style="justify-content:space-between;margin-top:8px;font-size:13.5px"><span class="' + (b.over ? 'neg' : '') + '">' +
      (b.over ? T('budget_over', { a: '<b class="mono">' + fmtMoney(-b.left, t.currency) + '</b>' }) : T('budget_left', { a: '<b class="mono">' + fmtMoney(b.left, t.currency) + '</b>' })) + '</span>' +
      '<span class="mono muted">' + b.pct + '%</span></div>' +
      (b.projected != null ? '<div class="muted sm" style="margin-top:6px">' + T('budget_proj', { a: fmtMoney(b.projected, t.currency), d: Math.max(Number(t.days) || 0, I.nDays) }) + '</div>' : '') +
      '<div class="rule"></div>';
  }
  out += '<div class="lbl" style="margin-bottom:10px">' + T('by_cat') + '</div>' + I.cats.map(c =>
    '<div style="margin-bottom:10px"><div class="lead" style="font-size:13.5px;font-weight:500;text-transform:uppercase"><span>' + CATS[c.cat].label + '</span><span class="fill"></span><span>' + fmtPlain(c.amount, t.currency) + '</span><span class="muted" style="width:44px;text-align:right">' + Math.round(c.pct) + '%</span></div>' +
    '<div class="bar cat thin"><i style="width:' + c.pct + '%"></i></div></div>').join('') + '<div class="rule"></div>';
  out += '<div class="stmt"><span class="h">' + T('who_col') + '</span><span class="h r">' + T('paid_col').toUpperCase() + '</span><span class="h r">' + T('used_col').toUpperCase() + '</span>' +
    t.members.map(m => '<span>' + escapeHtml(nameOf(t, m.id)) + '</span><span class="r" style="font-weight:600">' + fmtPlain(I.paid[m.id] || 0, t.currency).replace(/\.00$/, '') + '</span><span class="r">' + fmtPlain(I.share[m.id] || 0, t.currency).replace(/\.00$/, '') + '</span>').join('') + '</div>';
  if (I.days.length > 1) {
    const maxD = Math.max(...I.days.map(d => d.amount));
    const k = a => a >= 1000 ? (Math.round(a / 100) / 10) + 'k' : String(Math.round(a));
    out += '<div class="rule"></div><div class="lbl" style="margin-bottom:10px">' + T('by_day') + '</div><div class="days">' + I.days.slice(-14).map(d =>
      '<div class="dcol" title="' + fmtMoney(d.amount, t.currency) + '"><div class="dv">' + k(d.amount) + '</div><div class="dbar"><i style="height:' + Math.max(3, d.amount * 100 / maxD) + '%"></i></div><div class="dl">' + escapeHtml(dayLabel(d.date, S.settings.lang)) + '</div></div>').join('') + '</div>';
  }
  if (I.top) {
    out += '<div class="rule"></div><div class="lbl" style="margin-bottom:8px">' + T('biggest') + '</div>' +
      '<div class="erow" data-act="open-expense" data-arg="' + I.top.id + '"><div class="lead"><span class="d">' + escapeHtml(I.top.desc || '') + '</span><span class="fill"></span><span>' + fmtPlain(I.top.amount, t.currency) + '</span></div>' +
      '<div class="meta">' + escapeHtml(nameOf(t, I.top.payerId)) + ' ' + T('paid_w') + ' · ' + dayLabel(I.top.date, S.settings.lang) + '</div></div>';
  }
  out += '<div class="bill-total"><span>' + T('total').toUpperCase() + ' · ' + I.count + ' ' + T('bills').toUpperCase() + '</span><span>' + fmtMoney(I.total, t.currency) + '</span></div>';
  out += '<div class="muted sm" style="margin-top:6px">' + T('avg_day') + ': <b class="mono">' + fmtMoney(I.perDay, t.currency) + '</b></div></div>';
  return out;
}


/* ---------- add expense ---------- */
function defaultDraft(t, pre) {
  const d = {
    amount: '', desc: '', cat: 'other', payerId: meIdOf(t), parts: t.members.map(m => m.id),
    custom: false, customAmts: {}, img: null, src: 'form', raw: '', ai: false, hint: '', date: todayStr(),
    split: 'equal', items: null, extra: '', receipt: null
  };
  if (pre) Object.assign(d, pre);
  if (!d.parts.length) d.parts = t.members.map(m => m.id);
  return d;
}
function catChips(d) {
  return '<div class="chips" style="margin-top:9px">' + Object.keys(CATS).filter(k => k !== 'other').map(k =>
    '<button class="chip tpl' + (d.cat === k ? ' cat-on' : '') + '" data-act="catpick" data-arg="' + k + '">' + ic(k, 's') + ' ' + CATS[k].label + '</button>'
  ).join('') + '</div>';
}
function formHtml() {
  const t = curTrip(), d = ui.draft;
  const cur = t.currency === 'INR' ? '₹' : t.currency;
  let payer = t.members.map(m =>
    '<button class="chip' + (d.payerId === m.id ? ' on' : '') + '" data-act="pay" data-arg="' + m.id + '">' +
    avHtml(m, 'xs') + ' ' + escapeHtml(displayName(t, m, S.me.name)) + (m.self ? ' (you)' : '') + '</button>'
  ).join('');
  let parts = t.members.map(m =>
    '<button class="chip' + (d.parts.includes(m.id) ? ' on' : '') + '" data-act="part" data-arg="' + m.id + '">' +
    escapeHtml(displayName(t, m, S.me.name)) + '</button>'
  ).join('');
  const splitSeg = '<div class="seg sm-seg">' +
    ['equal', 'custom', 'items'].map(k => '<button class="seg-b' + ((d.split || (d.custom ? 'custom' : 'equal')) === k ? ' on' : '') + '" data-act="split-mode" data-arg="' + k + '">' +
      { equal: T('split_equal'), custom: T('split_custom'), items: T('split_items') }[k] + '</button>').join('') + '</div>';
  if (d.split === 'items') {
    return '' +
      '<div class="amt-wrap"><span class="cur">' + cur + '</span><input class="amt-in" id="f_amount" readonly value="' + (d.amount || '') + '" placeholder="0"></div>' +
      '<div class="fld"><label>' + T('what_for') + '</label><input class="input" id="f_desc" placeholder="' + T('what_ph') + '" value="' + escapeHtml(d.desc || '') + '">' + catChips(d) + '</div>' +
      '<div class="fld"><label>' + T('paid_by') + '</label><div class="chips">' + payer + '</div></div>' +
      '<div class="fld"><label>' + T('who_involved') + '</label>' + splitSeg + itemsEditorHtml() + '</div>';
  }
  let custom = '';
  if (d.custom) {
    const rows = d.parts.map(id => {
      const m = memberById(t, id);
      return '<div class="crow">' + avHtml(m, 'xs') + '<span class="nm">' + escapeHtml(displayName(t, m, S.me.name)) + '</span>' +
        '<input class="camt" data-camt="' + id + '" inputmode="decimal" placeholder="0" value="' + (d.customAmts[id] != null ? d.customAmts[id] : '') + '"></div>';
    }).join('');
    custom = '<div class="custom-box">' + rows + '<div id="customStatus" class="muted sm" style="margin:8px 2px 4px">' + customStatusHtml() + '</div>' +
      '<button class="btn btn-ghost mini" data-act="autofill">' + T('fill_rest') + '</button></div>';
  } else {
    custom = '';
  }
  const rcptBanner = d.receipt && d.receipt.items && d.split !== 'items'
    ? '<button class="rcpt-banner" data-act="split-mode" data-arg="items">' + T('items_found', { n: d.receipt.items.length }) + '</button>' : '';
  return '' +
    '<div class="amt-wrap"><span class="cur">' + cur + '</span><input class="amt-in" id="f_amount" inputmode="decimal" placeholder="0" value="' + (d.amount || '') + '"></div>' +
    '<div class="fld"><label>' + T('what_for') + '</label><input class="input" id="f_desc" placeholder="' + T('what_ph') + '" value="' + escapeHtml(d.desc || '') + '">' + catChips(d) + '</div>' +
    '<div class="fld"><label>' + T('paid_by') + '</label><div class="chips">' + payer + '</div></div>' +
    '<div class="fld"><label>' + T('who_involved') + '</label>' + rcptBanner + splitSeg + '<div class="chips">' +
    '<button class="chip tpl' + (d.parts.length === t.members.length ? ' on' : '') + '" data-act="part-every">' + T('everyone') + '</button>' +
    '<button class="chip tpl' + (d.parts.length === 1 && d.parts[0] === meIdOf(t) ? ' on' : '') + '" data-act="part-me">' + T('just_me') + '</button>' +
    parts + '</div>' + custom +
    (d.hint === 'learned' ? '<div class="hint-learn">' + T('learned_hint') + '</div>' : '') + '</div>';
}
function itemsEditorHtml() {
  const t = curTrip(), d = ui.draft;
  const rows = (d.items || []).map((it, i) => {
    const who = t.members.map(m => {
      const on = it.who.includes(m.id);
      const nm = displayName(t, m, S.me.name);
      return '<button class="ich' + (on ? ' on' : '') + '" style="--c:' + colorFor(nm) + '" data-act="item-who" data-arg="' + i + '|' + m.id + '" title="' + escapeHtml(nm) + '">' + escapeHtml(nm.slice(0, 2)) + '</button>';
    }).join('');
    return '<div class="itm"><div class="row"><input class="input iname" data-iname="' + i + '" placeholder="' + T('item_ph') + '" value="' + escapeHtml(it.name || '') + '">' +
      '<input class="camt" data-iprice="' + i + '" inputmode="decimal" placeholder="0" value="' + (it.price !== '' && it.price != null ? it.price : '') + '">' +
      '<button class="mini-link" data-act="item-del" data-arg="' + i + '">✕</button></div>' +
      '<div class="iwho"><button class="ich all" data-act="item-all" data-arg="' + i + '" aria-label="' + T('everyone') + '">' + ic('users', 's') + '</button>' + who + '</div></div>';
  }).join('');
  return '<div class="custom-box">' + rows +
    '<button class="btn btn-ghost mini" data-act="item-add" style="margin:4px 0 12px">' + T('add_item') + '</button>' +
    '<label class="sm muted" style="display:block;margin-bottom:6px">' + T('extra_lbl') + '</label>' +
    '<input class="camt" style="width:130px" data-extra="1" inputmode="decimal" placeholder="0" value="' + (d.extra || '') + '">' +
    '<div id="itemsStatus" class="muted sm" style="margin-top:10px">' + itemsStatusHtml() + '</div></div>';
}
function itemsResult() {
  const d = ui.draft;
  return splitItems((d.items || []).map(it => ({ price: parseFloat(String(it.price).replace(/,/g, '')) || 0, who: it.who })), parseFloat(String(d.extra || '').replace(/,/g, '')) || 0);
}
function itemsStatusHtml() {
  const t = curTrip(), r = itemsResult();
  if (!(r.amount > 0)) return T('items_need');
  const per = Object.keys(r.shares).map(id => escapeHtml(displayName(t, memberById(t, id), S.me.name)) + ' <b>' + fmtMoney(r.shares[id], t.currency) + '</b>').join(' · ');
  return T('items_total', { a: fmtMoney(r.subtotal, t.currency), x: fmtMoney(r.extra, t.currency), t: fmtMoney(r.amount, t.currency) }) + '<div style="margin-top:6px;color:var(--ink)">' + per + '</div>';

function refreshItems() {
  const r = itemsResult();
  ui.draft.amount = r.amount > 0 ? String(r.amount) : '';
  const a = $('#f_amount'); if (a) a.value = ui.draft.amount;
  const st = $('#itemsStatus'); if (st) st.innerHTML = itemsStatusHtml();
}
function customStatusHtml() {
  const d = ui.draft, amt = parseFloat(d.amount) || 0;
  const sum = round2(Object.values(d.customAmts).reduce((s, v) => s + (parseFloat(v) || 0), 0));
  const diff = round2(amt - sum);
  if (amt <= 0) return '—';
  if (Math.abs(diff) < 0.005) return '<span style="color:var(--get)">' + fmtMoney(amt, curTrip().currency) + '</span>';
  if (diff > 0) return fmtMoney(diff, curTrip().currency) + ' ' + T('remaining');
  return fmtMoney(-diff, curTrip().currency) + ' ' + T('over_by');
}
function multiListHtml() {

function scrAdd() {

  if (!t) return scrHome();
  const d = ui.draft || defaultDraft(t);
  const inMulti = !!(ui.multi && ui.multi.index == null);
  const inMultiEdit = !!(ui.multi && ui.multi.index != null);
  const seg = (act, ic, lab) => '<button class="seg-b' + (ui.addTab === act ? ' on' : '') + '" data-act="tab-' + act + '">' + ic + ' ' + lab + '</button>';
  let body = '';

/* ---------- share card: dark, calm, readable in a chat (1080 wide, 4:5 or taller) ---------- */
function shareAmt(n, cur) { return fmtMoney(cur === 'INR' ? Math.round(Number(n) || 0) : n, cur); }
function drawShareCard(t, c) {
  const W = 1080;
  const flows = c.flows.slice(0, 6);
  const payee = (() => { const ids = [...new Set(c.flows.map(f => f.to))]; for (const id of ids) { const m = memberById(t, id); if (m && isVpa(m.upi) && t.currency === 'INR') return m; } return null; })();
  const I = tripInsights(t);
  const H = Math.max(1350, 1000 + (flows.length || 1) * 96 + (c.flows.length > 6 ? 60 : 0) + (payee ? 170 : 0));
  const cv = document.createElement('canvas'); cv.width = W; cv.height = H;
  const x = cv.getContext('2d');
  const DISP = '"Bricolage Grotesque", "Manrope", sans-serif', BODY = '"Manrope", system-ui, sans-serif';
  const WH = '#FFFFFF', DIM = '#A9A7C2', FAINT = '#8C8AA6', GET = '#8EE6B4', IND = '#B4B4FF';
  x.fillStyle = '#12112A'; x.fillRect(0, 0, W, H);
  const g = x.createRadialGradient(0, 0, 0, 0, 0, W * 1.1); g.addColorStop(0, 'rgba(58,50,150,.85)'); g.addColorStop(.6, 'rgba(42,36,112,0)');
  x.fillStyle = g; x.fillRect(0, 0, W, H);
  const P = 84;
  const rr = (X, Y, w, h, r) => { x.beginPath(); x.moveTo(X + r, Y); x.arcTo(X + w, Y, X + w, Y + h, r); x.arcTo(X + w, Y + h, X, Y + h, r); x.arcTo(X, Y + h, X, Y, r); x.arcTo(X, Y, X + w, Y, r); x.closePath(); };
  const fit = (str, max) => { let o = String(str); while (o.length > 1 && x.measureText(o).width > max) o = o.slice(0, -2) + '…'; return o; };
  const icon = (name, X, Y, size, color) => {
    const m = String(ICONS[name] || ICONS.receipt);
    x.save(); x.translate(X, Y); x.scale(size / 24, size / 24);
    x.strokeStyle = color; x.lineWidth = 2; x.lineCap = 'round'; x.lineJoin = 'round';
    (m.match(/d="([^"]+)"/g) || []).forEach(d => x.stroke(new Path2D(d.slice(3, -1))));
    (m.match(/<circle[^>]*>/g) || []).forEach(cc => { const n = k => Number((cc.match(new RegExp(k + '="([\\d.]+)"')) || [])[1] || 0); x.beginPath(); x.arc(n('cx'), n('cy'), n('r'), 0, Math.PI * 2); x.stroke(); });
    (m.match(/<rect[^>]*>/g) || []).forEach(cc => { const n = k => Number((cc.match(new RegExp(' ' + k + '="([\\d.]+)"')) || [])[1] || 0); rr(n('x'), n('y'), n('width'), n('height'), n('rx') || 0.01); x.stroke(); });
    x.restore();
  };
  const avatar = (name, X, Y, r) => {
    x.fillStyle = colorFor(name || '?'); x.beginPath(); x.arc(X, Y, r, 0, Math.PI * 2); x.fill();
    x.fillStyle = '#1A1A2E'; x.font = '800 ' + Math.round(r * 0.95) + 'px ' + BODY; x.textAlign = 'center'; x.textBaseline = 'middle';
    x.fillText(String(name || '?').charAt(0).toUpperCase(), X, Y + 2); x.textBaseline = 'alphabetic';
  };
  let y = P + 40;
  x.textAlign = 'left'; x.fillStyle = WH; x.font = '800 52px ' + DISP; x.fillText('billo', P, y);
  const bw = x.measureText('billo').width; x.fillStyle = '#8F8FFF'; x.fillText('.', P + bw, y);
  x.textAlign = 'right'; x.fillStyle = DIM; x.font = '600 30px ' + BODY;
  x.fillText(new Date().toLocaleDateString('en-IN', { day: 'numeric', month: 'short', year: 'numeric' }), W - P, y);
  y += 90;
  x.fillStyle = 'rgba(143,143,255,.16)'; rr(P, y, 120, 120, 34); x.fill();
  icon(tripIconOf(t), P + 30, y + 30, 60, IND);
  x.textAlign = 'left'; x.fillStyle = WH; x.font = '700 70px ' + DISP; x.fillText(fit(t.name, W - P * 2 - 160), P + 156, y + 66);
  x.fillStyle = DIM; x.font = '600 32px ' + BODY;
  x.fillText(t.members.length + ' ' + T('people') + ' · ' + (t.expenses || []).length + ' ' + T('bills'), P + 156, y + 112);
  y += 250;
  x.fillStyle = WH; x.font = '800 132px ' + DISP; x.fillText(shareAmt(I.total, t.currency), P, y);
  y += 58; x.fillStyle = DIM; x.font = '600 34px ' + BODY;
  if (evenSplit(t)) x.fillText(shareAmt(t.members.length ? I.total / t.members.length : 0, t.currency) + ' ' + T('per_person'), P, y);
  else x.fillText(T('split_differs'), P, y);
  y += 96;
  x.fillStyle = DIM; x.font = '800 26px ' + BODY; x.letterSpacing = '6px'; x.fillText(T('who_pays').toUpperCase(), P, y); x.letterSpacing = '0px';
  y += 30;
  if (flows.length) {
    flows.forEach(f => {
      x.strokeStyle = 'rgba(255,255,255,.10)'; x.lineWidth = 2; x.beginPath(); x.moveTo(P, y); x.lineTo(W - P, y); x.stroke();
      const cy = y + 48, fn = nameOf(t, f.from), tn = nameOf(t, f.to);
      avatar(fn, P + 30, cy, 30);
      x.textAlign = 'left'; x.fillStyle = WH; x.font = '700 38px ' + BODY;
      const n1 = fit(fn, 250); x.fillText(n1, P + 76, cy + 13);
      let X = P + 76 + x.measureText(n1).width + 22;
      x.strokeStyle = FAINT; x.lineWidth = 4; x.lineCap = 'round'; x.beginPath(); x.moveTo(X, cy); x.lineTo(X + 34, cy); x.moveTo(X + 22, cy - 11); x.lineTo(X + 34, cy); x.lineTo(X + 22, cy + 11); x.stroke();
      X += 56; avatar(tn, X + 30, cy, 30);
      x.textAlign = 'left'; x.fillStyle = WH; x.font = '700 38px ' + BODY; x.fillText(fit(tn, 230), X + 76, cy + 13);
      x.textAlign = 'right'; x.fillStyle = GET; x.font = '800 40px ' + BODY; x.fillText(shareAmt(f.amount, t.currency), W - P, cy + 14);
      y += 96;
    });
    if (c.flows.length > 6) { x.textAlign = 'left'; x.fillStyle = DIM; x.font = '600 30px ' + BODY; x.fillText('+ ' + (c.flows.length - 6) + ' ' + T('more_bills'), P, y + 44); y += 60; }
  } else {
    x.strokeStyle = 'rgba(255,255,255,.10)'; x.lineWidth = 2; x.beginPath(); x.moveTo(P, y); x.lineTo(W - P, y); x.stroke();
    x.textAlign = 'left'; x.fillStyle = GET; x.font = '800 44px ' + DISP; x.fillText(T('everyone_square'), P, y + 64); y += 96;
  }
  if (payee) {
    y += 30;
    x.fillStyle = 'rgba(255,255,255,.07)'; rr(P, y, W - P * 2, 130, 32); x.fill();
    x.fillStyle = 'rgba(143,143,255,.18)'; rr(P + 26, y + 29, 72, 72, 20); x.fill();
    x.textAlign = 'center'; x.fillStyle = IND; x.font = '800 30px ' + BODY; x.fillText('UPI', P + 62, y + 76);
    x.textAlign = 'left'; x.fillStyle = WH; x.font = '700 34px ' + BODY; x.fillText(fit(T('pay_on_upi', { name: nameOf(t, payee.id) }), W - P * 2 - 160), P + 124, y + 58);
    x.fillStyle = DIM; x.font = '600 30px ' + BODY; x.fillText(fit(payee.upi.trim().toLowerCase(), W - P * 2 - 160), P + 124, y + 100);
    y += 130;
  }

  x.fillText(APP.tagline + ' · billo.app', P, H - P + 10);
  return cv;
}

/* ---------- photo / AI ---------- */
function compressImage(file, maxDim, q) {
  maxDim = maxDim || 1280; q = q || 0.78;
  return new Promise((res, rej) => {
    const fr = new FileReader();
    fr.onload = () => {
      const img = new Image();
      img.onload = () => {
        const s = Math.min(1, maxDim / Math.max(img.width, img.height));
        const c = document.createElement('canvas');
        c.width = Math.max(1, Math.round(img.width * s)); c.height = Math.max(1, Math.round(img.height * s));
        c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
        res(c.toDataURL('image/jpeg', q));
      };
      img.onerror = rej; img.src = fr.result;
    };
    fr.onerror = rej; fr.readAsDataURL(file);
  });
}
async function handlePhoto(file) {
  if (!file) return;
  const t = curTrip();
  try {
    const dataUrl = await compressImage(file);
    /* Read from a high-quality rendition, not the small preview JPEG: at 1280px/q0.78
       the artefacts around small glyphs are enough to turn "₹1,250" into "71,250".
       The compressed copy is still what we store/preview. */
    let readUrl = dataUrl;
    try { readUrl = await compressImage(file, 2200, 0.95); } catch (e) { /* keep the preview copy */ }
    ui.draft.img = dataUrl;
    ui.draft.src = 'photo';
    let filled = false;
    const a = S.settings.ai;
    /* 1) cloud AI — only if the user has configured a key (most accurate) */
    if (a.enabled && a.key) {
      toast(T('reading'));
      render();
      try {
        const o = await aiExtract(readUrl);
        applyAi(o);
        if (o.items && o.items.length >= 2) ui.draft.receipt = { items: o.items, extra: o.extra, total: o.amount };
        ui.draft.ai = true;
        filled = o.amount > 0;
      } catch (e) { /* fall through to on-device OCR */ }
    }
    /* 2) on-device OCR — no key, no network, always available */
    if (!filled) {
      toast(T('ocr_reading'));
      render();
      try {
        const text = await ocrPhoto(readUrl);
        const r = parseExpenseText(text, t, meName);
        const d = ui.draft;
        const rc = parseReceiptItems(text);
        if (rc) { d.receipt = rc; if (!(r.amount > 0) && rc.total > 0) r.amount = rc.total; }
        if (r.amount > 0 && !(parseFloat(d.amount) > 0)) d.amount = String(r.amount);
        if (r.cat !== 'other' && d.cat === 'other') d.cat = r.cat;
        if (!d.desc && r.desc) d.desc = r.desc;
        if (r.partsFound) d.parts = r.parts.slice();
        if (!d.ai) d.ocr = true;
        filled = parseFloat(d.amount) > 0;
      } catch (e) { toast(T('ocr_err')); }
    }
    if (!filled) toast(T('amt_miss'));
    const sg = learnSuggest(t, ui.draft.payerId, ui.draft.cat);
    if (sg && sg.ids.length && !ui.draft.parts.length) { ui.draft.parts = sg.ids.slice(); ui.draft.hint = 'learned'; }
  } catch (e) { toast(T('photo_err')); }
  render();
}
function applyAi(o) {
  const d = ui.draft;
  if (o.amount > 0) d.amount = String(o.amount);
  const cat = String(o.category || '').toLowerCase();
  if (CATS[cat]) d.cat = cat;
  if (!d.desc && (o.desc || o.merchant)) d.desc = String(o.desc || o.merchant).slice(0, 40);
  /* if the payer name visible on the receipt matches a member, use it */
  if (o.payer_hint) {
    const t = curTrip();
    const hint = String(o.payer_hint).toLowerCase();
    const hit = (t && t.members) ? t.members.find(m => {
      const dn = displayName(t, m, meName).toLowerCase();
      return dn && (dn.indexOf(hint) === 0 || hint.indexOf(dn) === 0);
    }) : null;
    if (hit) d.payerId = hit.id;
  }
}
async function aiExtract(dataUrl) {
  const a = S.settings.ai;
  const body = {
    model: a.model, max_tokens: 900,
    messages: [
      { role: 'system', content: 'You extract ONE expense from a photo of a receipt, bill, invoice, or a UPI/payment screenshot (Google Pay, PhonePe, Paytm, bank app, card swipe). ' +
        'Rules: "amount" MUST be the amount PAID (the big total on the screen) — never a balance, never "amount added", never a fee. ' +
        '"merchant" = payee/shop/restaurant name (on UPI screens, the person/business you paid). ' +
        '"desc" = short human description (e.g. "Dinner at Blue Tokai", "GPay to Rahul"). ' +
        '"category" = one of food|cab|hotel|travel|fuel|shop|health|fun|gift|other (food payments = food). ' +
        '"currency" = 3-letter code (default INR). "date" = transaction date YYYY-MM-DD (null if not visible). ' +
        '"payer_hint" = name of the person who paid if visible, else null. ' +
        '"items" = for itemized restaurant/shop bills, the line items as [{"name":"","price":0}] with price = line total (qty × rate); [] for UPI screenshots or when not itemized. ' +
        '"extra" = sum of taxes, service charge, tips and fees minus discounts (0 if none). ' +
        'Reply with ONLY minified JSON — no markdown, no code fences, no extra text: {"merchant":"","desc":"","category":"other","amount":0,"currency":"INR","date":null,"payer_hint":null,"items":[],"extra":0}' },
      { role: 'user', content: [
        { type: 'text', text: 'Extract the expense from this bill / payment screenshot. If several numbers appear (balances, old transactions, fees), use ONLY the amount paid for this transaction. Return pure JSON.' },
        { type: 'image_url', image_url: { url: dataUrl } }
      ] }
    ]
  };
  const r = await fetch(a.baseUrl.replace(/\/+$/, '') + '/chat/completions', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json', 'Authorization': 'Bearer ' + a.key },
    body: JSON.stringify(body)
  });
  if (!r.ok) throw new Error('HTTP ' + r.status);
  const j = await r.json();
  const txt = (j.choices && j.choices[0] && j.choices[0].message && j.choices[0].message.content) || '';
  /* extract the first balanced {...} block — tolerant of markdown fences / chatter */
  let o = null;
  const start = txt.indexOf('{');
  if (start >= 0) {
    let depth = 0, end = -1;
    for (let i = start; i < txt.length; i++) {
      if (txt[i] === '{') depth++;
      else if (txt[i] === '}') { depth--; if (depth === 0) { end = i; break; } }
    }
    if (end > start) { try { o = JSON.parse(txt.slice(start, end + 1)); } catch (e) { o = null; } }
  }
  if (!o || typeof o !== 'object') throw new Error('no JSON');
  /* coerce types so a sloppy model reply still works */
  let amt = o.amount;
  if (typeof amt === 'string') amt = amt.replace(/[^0-9.]/g, '');
  amt = parseFloat(amt);
  return {
    merchant: String(o.merchant || '').slice(0, 60),
    desc: String(o.desc || o.merchant || '').slice(0, 40),
    category: CATS[o.category] ? o.category : 'other',
    amount: (isFinite(amt) && amt > 0) ? round2(amt) : 0,
    currency: String(o.currency || 'INR').toUpperCase(),
    date: /^\d{4}-\d{2}-\d{2}$/.test(String(o.date || '')) ? o.date : null,
    payer_hint: String(o.payer_hint || '').slice(0, 40),
    items: Array.isArray(o.items) ? o.items.map(it => ({ name: titleCase(String((it && it.name) || '').toLowerCase()).slice(0, 40), price: round2(parseFloat(String((it && it.price) || '').replace(/[^0-9.]/g, '')) || 0) })).filter(it => it.name && it.price > 0).slice(0, 40) : [],
    extra: round2(parseFloat(o.extra) || 0)
  };
}

/* ---------- on-device OCR: no key, no network — the photo never leaves the phone ---------- */
/* NOTE on paths: tesseract.js resolves `corePath` as a DIRECTORY unless it ends in ".js",
   in which case the file is loaded as-is. Pointing it at the directory made it request
   "ocr/tesseract-core-simd-lstm.wasm.js", which we do not ship (we ship the plain
   ".js" loader + the ".wasm" binary beside it) → importScripts 404 → OCR never ran.
   Likewise `gzip` defaults to true, which made it request "ocr/eng.traineddata.gz"
   instead of the uncompressed "ocr/eng.traineddata" we bundle. Both are pinned below. */
let ocrWorkerPromise = null;
function ocrSimdSupported() {
  try {
    /* a tiny module using v128 — validates only where WebAssembly SIMD is available */
    return WebAssembly.validate(new Uint8Array(
      [0, 97, 115, 109, 1, 0, 0, 0, 1, 5, 1, 96, 0, 1, 123, 3, 2, 1, 0, 10, 10, 1, 8, 0, 65, 0, 253, 15, 253, 98, 11]
    ));
  } catch (e) { return false; }
}
function loadOcrWorker() {
  if (!ocrWorkerPromise) {
    ocrWorkerPromise = new Promise((res, rej) => {
      if (!ocrSimdSupported()) { rej(new Error('This browser has no WebAssembly SIMD support')); return; }
      const start = () => {
        Tesseract.createWorker('eng', 1, {
          workerPath: 'ocr/worker.min.js',
          /* explicit file (ends in .js) → loaded directly; the .wasm is fetched beside it */
          corePath: 'ocr/tesseract-core-simd-lstm.js',
          langPath: 'ocr',
          /* we bundle an uncompressed eng.traineddata, not eng.traineddata.gz */
          gzip: false,
          /* load the worker from its real URL, not a blob: — the emscripten core resolves
             tesseract-core-simd-lstm.wasm relative to the worker script, and a blob: worker
             has no directory to resolve against ("Failed to parse URL from …wasm") */
          workerBlobURL: false
        }).then(res, rej);
      };
      if (window.Tesseract) start();
      else {
        const s = document.createElement('script');
        s.src = 'ocr/tesseract.min.js';
        s.onload = start;
        s.onerror = () => rej(new Error('could not load ocr/tesseract.min.js'));
        document.head.appendChild(s);
      }
    });
    /* never cache a rejected promise — otherwise one failure disables OCR for the whole session */
    ocrWorkerPromise.catch(() => { ocrWorkerPromise = null; });
  }
  return ocrWorkerPromise;
}
async function ocrPhoto(dataUrl) {
  const w = await loadOcrWorker();
  const out = await w.recognize(dataUrl);
  return (out && out.data && out.data.text) || '';
}
async function aiTest() {
  const a = S.settings.ai;
  try {
    const r = await fetch(a.baseUrl.replace(/\/+$/, '') + '/chat/completions', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json', 'Authorization': 'Bearer ' + a.key },
      body: JSON.stringify({ model: a.model, max_tokens: 5, messages: [{ role: 'user', content: 'Reply with the single word OK.' }] })
    });
    if (!r.ok) throw new Error('HTTP ' + r.status);
    toast(T('ai_ok'));
  } catch (e) { toast(T('ai_fail') + ' (' + e.message + ')'); }
}

  tpl(cat) {
    const el = $('#sayText');
    if (!el) return;
    const cur = el.value.trim();
    const fill = { cab: 'cab', food: 'dinner', hotel: 'hotel stay', fuel: 'petrol' }[cat] || cat;
    if (!cur) {
      el.value = 'Paid ₹ ' + fill + ' for ';
    } else {
      /* never wipe the user's text — just make sure the category keyword is in there */
      const kw = { cab: 'cab', food: 'food', hotel: 'hotel', fuel: 'fuel' }[cat] || cat;
      const syn = cat === 'food' ? /\b(food|dinner|lunch|breakfast|eat|khana|booze|beer|wine)\b/i : new RegExp('\\b' + escapeRe(kw) + '\\b', 'i');
      if (!syn.test(cur)) el.value = cur + ' ' + kw;
    }
    el.focus();
    el.setSelectionRange(el.value.length, el.value.length);
  },
  'parse-say'() {
    const t = curTrip();
    const el = $('#sayText');
    const txt = (el && el.value || '').trim();
    if (!txt) { toast(T('enter_something')); return; }
    const results = parseExpenseTextAll(txt, t, S.me.name);
    if (results.length <= 1) {
      const r = results[0];
      ui.draft = defaultDraft(t, {
        amount: r.amount ? String(r.amount) : '', desc: r.desc, cat: r.cat, payerId: r.payerId,
        parts: r.parts.slice(), src: 'text', raw: txt
      });
      const sg = learnSuggest(t, ui.draft.payerId, ui.draft.cat);
      if (sg && sg.ids.length && !r.partsFound) { ui.draft.parts = sg.ids.slice(); ui.draft.hint = 'learned'; }
      ui.addStep = 'form';
    } else {
      ui.multi = { results, selected: results.map(() => true), index: null };
      ui.draft = defaultDraft(t);
      ui.addStep = 'multi';
    }
    render();
  },

  'multi-save'() {
    if (!ui.multi || ui.multi.index == null) return;
    const d = ui.draft;
    const amt = round2(parseFloat(d.amount) || 0);
    if (amt <= 0) { toast(T('enter_amount')); return; }
    if (!d.parts.length) { toast(T('who_q')); return; }
    const parts = d.parts.slice();
    if (!parts.includes(d.payerId)) parts.unshift(d.payerId);
    ui.multi.results[ui.multi.index] = {
      amount: amt, desc: (d.desc || '').trim() || (CATS[d.cat] || CATS.other).label, cat: d.cat || 'other',
      payerId: d.payerId, parts: [...new Set(parts)], raw: d.raw || ''
    };
    ui.multi.index = null;
    ui.addStep = 'multi';
    render();

  'multi-add'() {
    if (!ui.multi) return;
    const t = curTrip();
    const idxs = ui.multi.results.map((r, i) => i).filter(i => ui.multi.selected[i]);
    if (!idxs.length) { toast(T('who_q')); return; }
    const newOnes = idxs.map(i => {
      const r = ui.multi.results[i];
      const parts = r.parts.slice();
      if (!parts.includes(r.payerId)) parts.unshift(r.payerId);
      return {
        id: uid('e'), ts: Date.now(),
        desc: billName(r), cat: r.cat || 'other',
        amount: r.amount, currency: t.currency, date: todayStr(),
        payerId: r.payerId, parts: [...new Set(parts)],
        custom: false, customAmts: null, settled: false, src: 'text', raw: r.raw || '', ai: false, img: ''
      };
    });
    t.expenses = t.expenses || [];
    t.expenses = newOnes.concat(t.expenses);
    newOnes.forEach(e => learnRecord(t, e));
    save();
    ui.doneMulti = { count: newOnes.length, total: round2(newOnes.reduce((s, e) => s + e.amount, 0)) };
    ui.doneTrip = t.id; ui.doneExpId = null;
    go('done');
  },

    render();
  },
  pay(mid) { ui.draft.payerId = mid; const t = curTrip(); if (!ui.draft.parts.includes(mid)) ui.draft.parts.push(mid); render(); },
  part(mid) {
    const d = ui.draft;
    const i = d.parts.indexOf(mid);
    if (i >= 0) { if (d.parts.length > 1) d.parts.splice(i, 1); }
    else d.parts.push(mid);
    render();
  },
  'split-mode'(k) {
    const d = ui.draft, t = curTrip();
    d.split = k;
    d.custom = k === 'custom';
    if (k === 'custom') {
      d.customAmts = Object.fromEntries(Object.entries(splitEqual(parseFloat(d.amount) || 0, d.parts)).map(([a, v]) => [a, String(v)]));
    }
    if (k === 'items' && !(d.items && d.items.length)) {
      const all = d.parts.length ? d.parts.slice() : t.members.map(m => m.id);
      if (d.receipt && d.receipt.items) {
        d.items = d.receipt.items.map(it => ({ name: it.name, price: String(it.price), who: all.slice() }));
        d.extra = d.receipt.extra ? String(d.receipt.extra) : '';
      } else {
        const a = parseFloat(d.amount) || 0;
        d.items = [{ name: d.desc || '', price: a > 0 ? String(a) : '', who: all.slice() }];
      }
    }
    if (k === 'items') { const r = itemsResult(); d.amount = r.amount > 0 ? String(r.amount) : d.amount; }
    render();
  },
  'item-add'() { const d = ui.draft, t = curTrip(); d.items = d.items || []; d.items.push({ name: '', price: '', who: t.members.map(m => m.id) }); render(); const el = $('[data-iname="' + (d.items.length - 1) + '"]'); if (el) el.focus(); },
  'item-del'(i) { const d = ui.draft; d.items.splice(Number(i), 1); refreshItems(); render(); },
  'item-who'(arg) {
    const [i, mid] = String(arg).split('|');
    const it = ui.draft.items[Number(i)];
    if (!it) return;
    const k = it.who.indexOf(mid);
    if (k >= 0) it.who.splice(k, 1); else it.who.push(mid);
    refreshItems(); render();
  },
  'item-all'(i) {
    const it = ui.draft.items[Number(i)], t = curTrip();
    if (!it) return;
    it.who = it.who.length === t.members.length ? [meIdOf(t)] : t.members.map(m => m.id);
    refreshItems(); render();
  },
  'part-every'() { ui.draft.parts = curTrip().members.map(m => m.id); render(); },
  'part-me'() { ui.draft.parts = [meIdOf(curTrip())]; render(); },
  autofill() {
    const d = ui.draft, t = curTrip();
    const amt = parseFloat(d.amount) || 0;
    if (amt <= 0) { toast(T('enter_amount')); return; }
    const given = {}; let sum = 0;
    d.parts.forEach(id => { const v = parseFloat((d.customAmts || {})[id]) || 0; given[id] = v; sum = round2(sum + v); });
    const diff = round2(amt - sum);
    const empty = d.parts.filter(id => !given[id]);
    if (empty.length && Math.abs(diff) >= 0.005) {
      const per = Math.floor(diff * 100 / empty.length) / 100;
      let rem = round2(diff - per * empty.length);
      empty.forEach(id => { given[id] = per; });
      if (Math.abs(rem) >= 0.005 && empty[0] != null) given[empty[empty.length - 1]] = round2(given[empty[empty.length - 1]] + rem);
    } else if (!empty.length && Math.abs(diff) >= 0.005) {
      toast(T('split_err')); return;
    }
    d.customAmts = given;
    const st = $('#customStatus'); if (st) st.innerHTML = customStatusHtml();
  },
  'confirm-draft'() {
    const t = curTrip();
    const d = ui.draft;
    let itemsOut = null;
    if (d.split === 'items') {
      const r = itemsResult();
      if (!(r.amount > 0)) { toast(T('items_need')); return; }
      d.amount = String(r.amount);
      d.custom = true;
      d.customAmts = Object.fromEntries(Object.entries(r.shares).map(([k, v]) => [k, String(v)]));
      d.parts = Object.keys(r.shares).filter(k => r.shares[k] !== 0);
      itemsOut = (d.items || []).filter(it => (parseFloat(it.price) || 0) > 0 && it.who.length)
        .map(it => ({ name: String(it.name || '').trim().slice(0, 40), price: round2(parseFloat(String(it.price).replace(/,/g, '')) || 0), who: it.who.slice() }));
    }
    const amt = round2(parseFloat(d.amount) || 0);
    if (amt <= 0) { toast(T('enter_amount')); return; }
    if (!d.parts.length) { toast(T('who_q')); return; }
    if (d.custom) {
      const sum = round2(Object.values(d.customAmts).reduce((s, v) => s + (parseFloat(v) || 0), 0));
      if (Math.abs(sum - amt) > 0.005) { toast(T('split_err')); return; }
    }
    const parts = d.parts.slice();
    if (!parts.includes(d.payerId) && !(parts.length === 1 && d.parts[0] === meIdOf(t))) parts.unshift(d.payerId);
    const cleanParts = [...new Set(parts)];
    const base = {
      desc: (d.desc || '').trim() || CATS[d.cat || 'other'].label,
      cat: d.cat || 'other', amount: amt, currency: t.currency, date: d.date || todayStr(),
      payerId: d.payerId, parts: cleanParts,
      custom: d.custom, customAmts: d.custom ? Object.assign({}, d.customAmts) : null,
      settled: false, src: d.src, raw: d.raw || '', ai: !!d.ai,
      img: (d.img && S.pro) ? d.img : '',
      items: itemsOut, extra: itemsOut ? round2(parseFloat(String(d.extra || '').replace(/,/g, '')) || 0) : 0
    };
    let e;
    if (ui.editExp) {
      /* live sync may have swapped the bill object while you were editing — edit the current one */
      e = (t.expenses || []).find(x => x.id === ui.editExp.id);
      if (!e) { e = Object.assign({ id: ui.editExp.id, ts: ui.editExp.ts || Date.now() }, base); t.expenses.unshift(e); }
      Object.assign(e, base);
    } else {
      e = Object.assign({ id: uid('e'), ts: Date.now() }, base);
      t.expenses = t.expenses || [];
      t.expenses.unshift(e);
    }
    learnRecord(t, e);
    save();
    ui.doneTrip = t.id; ui.doneExpId = e.id;
    go('done');
  },
  'done-trip'() { go('trip'); },
  'done-another'() { ACT['trip-add'](); },
  'share-wa'() {
    const t = curTrip();
    const c = computeTrip(t);
    const txt = buildShareText(t, c, S.me.name);
    if (nativeShareImage(ui.shareImg, txt)) return;
    if (window.Billo && window.Billo.shareText) { window.Billo.shareText(txt); return; }
    (async () => {
      try {
        if (ui.shareImg) {
          const blob = await (await fetch(ui.shareImg)).blob();
          const file = new File([blob], APP.name.toLowerCase() + '-' + t.code + '.png', { type: 'image/png' });
          if (navigator.canShare && navigator.canShare({ files: [file] })) {
            await navigator.share({ files: [file], text: txt });
            return;
          }
        }
      } catch (e) {}
      if (navigator.share) { try { await navigator.share({ text: txt }); } catch (e) {} }
      else if (copyText(txt)) toast(T('copied'));
    })();
  },
  'share-dl'() {
    if (!ui.shareImg) return;
    const a = document.createElement('a');
    a.href = ui.shareImg;
    a.download = APP.name.toLowerCase() + '-' + (curTrip() ? curTrip().code : 'trip') + '.png';
    document.body.appendChild(a); a.click(); a.remove();
    toast(T('share_down'));
  },
  'share-copy'() {
    const t = curTrip();
    if (copyText(buildShareText(t, computeTrip(t), S.me.name))) toast(T('copied'));
  },
  'set-export'() {
    try {
      const data = JSON.stringify({ app: 'billo', v: 1, exported: new Date().toISOString(), me: S.me, pro: S.pro, settings: S.settings, trips: S.trips });
      const blob = new Blob([data], { type: 'application/json' });
      const a = document.createElement('a');
      a.href = URL.createObjectURL(blob);
      a.download = 'billo-backup-' + new Date().toISOString().slice(0, 10) + '.json';
      document.body.appendChild(a); a.click(); a.remove();
      setTimeout(() => URL.revokeObjectURL(a.href), 4000);
    } catch (e) { toast(T('export_err')); }
  },
  'set-import'() {
    let inp = document.getElementById('importInput');
    if (!inp) {
      inp = document.createElement('input');
      inp.type = 'file'; inp.id = 'importInput'; inp.accept = 'application/json,.json'; inp.style.display = 'none';
      inp.addEventListener('change', ev => {
        const f = ev.target.files && ev.target.files[0];
        if (!f) return;
        const fr = new FileReader();
        fr.onload = () => {
          try {
            const d = JSON.parse(fr.result);
            if (!d || d.app !== 'billo' || !Array.isArray(d.trips)) throw new Error('bad');
            modal(T('import'), T('import_warn'), T('import'), false, () => {
              S.trips = d.trips.map(tr => Object.assign({}, tr, { sync: null }));
              if (d.pro) S.pro = true;
              save(); closeModal(); toast(T('imported')); go('home');
            });
          } catch (e) { toast(T('bad_import')); }
        };
        fr.readAsText(f);
        inp.value = '';
      });
      document.body.appendChild(inp);
    }
    inp.click();
  },
  'join-import'() { ACT['set-import'](); },
  'set-erase'() {
    modal(T('erase'), T('erase_warn'), T('erase'), true, () => {
      try { localStorage.removeItem(LS_KEY); } catch (e) {}
      if (SYNC) { SYNC.stop(); SYNC = null; syncLoading = null; }
      S = freshState(); ui = freshUi();
      if (!S.me.name) ui.screen = 'welcome';
      render();
      toast(T('erased'));
    });
  },
  'set-lang'(l) { S.settings.lang = l; save(); meName = S.me.name; render(); },
  'open-privacy'() {
    const url = 'https://' + APP.webUrl + '/privacy';
    if (window.Billo && window.Billo.openExternal) window.Billo.openExternal(url);
    else window.open(url, '_blank');
  },
  'nt-back'() { go('home'); },
  'nt-emoji'(e) { ui.ntEmoji = e; render(); },
  'nt-add-member'() {
    const el = $('#nt_member');
    const n = (el && el.value || '').trim();
    if (!n) return;
    if (ui.ntMembers.some(m => m.toLowerCase() === n.toLowerCase())) return;
    if (ui.ntMembers.length >= 12) return;
    ui.ntMembers.push(n);
    render();
    const el2 = $('#nt_member'); if (el2) el2.focus();
  },
  'nt-create'() {
    const nameEl = $('#nt_name');
    const name = (nameEl && nameEl.value || '').trim();
    if (!name) { toast(T('need_name')); return; }
    if (!S.me.name) { S.me.name = 'Me'; }
    const members = [{ id: uid('m'), name: S.me.name, self: true, upi: S.me.upi || '' }];
    ui.ntMembers.forEach(n => members.push({ id: uid('m'), name: n }));
    const code = (name.replace(/[^a-zA-Z]/g, '').slice(0, 3).toUpperCase() || 'TRP') + '-' + Math.floor(1000 + Math.random() * 9000);
    const t = {
      id: uid('t'), name, emoji: ui.ntEmoji, code, members,
      expenses: [], payments: [], learn: {}, currency: S.settings.currency, createdAt: Date.now()
    };
    S.trips.unshift(t);
    save();
    toast(T('created'));
    ui.tripId = t.id; ui.shareImg = null;
    go('trip');
  },
  'join-back'() { ui.joining = null; ui.joinPrefill = ''; go('home'); },
  'member-me'(mid) {
    const t = curTrip(); if (!t || !memberById(t, mid)) return;
    if (t.sync) { t.sync.memberId = mid; t.sync.meOk = true; }
    t.members.forEach(m => { m.self = m.id === mid; });
    save(); closeModal && closeModal(); toast(T('me_switched', { name: memberById(t, mid).name })); render();
  },
  'me-ok'() { const t = curTrip(); if (t && t.sync) { t.sync.meOk = true; save(); render(); } },
  'join-as'(mid) {
    const J = ui.joining;
    if (!J || !SYNC) return;
    const t = SYNC.adopt(J.rid, J.meta, mid, S.me.name || 'Me');
    ui.joining = null; ui.joinPrefill = '';
    ui.tripId = t.id; ui.stack = ['home'];
    toast(T('joined_live', { name: t.name }));
    go('trip');
  },
  'sync-on'() {
    const t = curTrip();
    modal(T('sync_cta_t'), '<div style="display:flex;flex-direction:column;gap:8px">' +
      '<div>' + T('sync_what') + '</div><div>' + T('sync_photos') + '</div><div>' + T('sync_who') + '</div></div>',
      T('sync_turn_on'), false, () => {});
    ui.modal.okAct = 'sync-on-go'; renderModal();
  },
  'sync-on-go'() {
    const t = curTrip();
    closeModal();
    if (!t || (t.sync && t.sync.on)) return;
    toast(T('sync_starting'));
    (async () => {
      try {
        const sy = await getSync();
        await sy.enable(t);
        render();
        ACT['trip-invite']();
      } catch (e) { toast(syncErrText(e)); }
    })();
  },
  'sync-detach'() {
    const t = curTrip();
    if (!t) return;
    if (SYNC) SYNC.leave(t);
    t.sync = null; t.code = (t.name.replace(/[^a-zA-Z]/g, '').slice(0, 3).toUpperCase() || 'TRP') + '-' + Math.floor(1000 + Math.random() * 9000);
    saveLocal(); render();
  },
  'trip-leave'() {
    const t = curTrip();
    closeModal();
    modal(T('leave_trip'), T('leave_trip_q'), T('leave_trip'), true, () => {
      if (SYNC && t.sync) SYNC.leave(t);
      S.trips = S.trips.filter(x => x.id !== t.id);
      saveLocal(); go('home');
    });
  },
  'join-go'() {
    const el = $('#join_code');
    const code = (el && el.value || '').trim().toUpperCase();
    if (syncAvailable()) {
      if (!normJoinCode(code)) { toast(T('join_bad_code')); return; }
      if (ui.joinBusy) return;
      ui.joinBusy = true; render();
      const inp = $('#join_code'); if (inp) inp.value = code;
      (async () => {
        try {
          const sy = await getSync();
          const r = await sy.lookup(code);
          if (!r) { toast(T('join_not_found')); return; }
          const existing = S.trips.find(t => t.sync && t.sync.remoteId === r);
          if (existing) { ui.tripId = existing.id; go('trip'); return; }
          const meta = await sy.join(r);
          ui.joining = { rid: r, meta };
          go('joinpick');
        } catch (e) { toast(syncErrText(e)); }
        finally { ui.joinBusy = false; if (ui.screen === 'join') render(); }
      })();
      return;
    }
    if (code.length < 4) { toast(T('join_code_ph')); return; }
    const members = [{ id: uid('m'), name: S.me.name || 'Me', self: true }];
    const t = {
      id: uid('t'), name: 'Trip ' + code, emoji: '🧳', code, members,
      expenses: [], payments: [], learn: {}, currency: S.settings.currency, createdAt: Date.now()
    };
    S.trips.unshift(t);
    save();
    toast(T('joined'));
    ui.tripId = t.id;
    go('trip');
  },
  'modal-ok'() {
    const m = ui.modal;
    const fn = m && m.onOk;
    closeModal();
    if (fn) fn();
  },
  'modal-cancel'() { closeModal(); }
};

/* ---------- native bridge hooks ---------- */
window.__billoPro = function () {
  S.pro = true; save();
  toast(T('pro_thanks'));
  render();
};

/* ---------- wiring ---------- */
function wire() {
  /* slide to pay / slide to save */
  let sl = null;
  const slReset = box => { const k = box.querySelector('.knob'), tx = box.querySelector('.stxt'); if (k) k.style.transform = ''; if (tx) tx.style.opacity = ''; };
  document.addEventListener('pointerdown', e => {
    const k = e.target.closest('.slide .knob');
    if (!k) return;
    const box = k.parentElement;
    sl = { box, k, x0: e.clientX, max: Math.max(40, box.clientWidth - k.offsetWidth - 12), dx: 0, id: e.pointerId };
    try { k.setPointerCapture(e.pointerId); } catch (_) {}
    box.classList.remove('go');
  });
  document.addEventListener('pointermove', e => {
    if (!sl || e.pointerId !== sl.id) return;
    sl.dx = Math.max(0, Math.min(sl.max, e.clientX - sl.x0));
    sl.k.style.transform = 'translateX(' + sl.dx + 'px)';
    const tx = sl.box.querySelector('.stxt'); if (tx) tx.style.opacity = String(Math.max(0, 1 - sl.dx / sl.max * 1.4));
  });
  const slEnd = e => {
    if (!sl || e.pointerId !== sl.id) return;
    const s0 = sl; sl = null;
    s0.box.classList.add('go');
    if (s0.dx >= s0.max * 0.82) {
      s0.k.style.transform = 'translateX(' + s0.max + 'px)';
      try { navigator.vibrate && navigator.vibrate(15); } catch (_) {}
      const act = s0.box.getAttribute('data-slide'), arg = s0.box.getAttribute('data-arg');
      setTimeout(() => { if (ACT[act]) ACT[act](arg); setTimeout(() => slReset(s0.box), 450); }, 160);
    } else {
      slReset(s0.box);
      if (s0.dx < 6) toast(T('slide_hint'));
    }
  };
  document.addEventListener('pointerup', slEnd);
  document.addEventListener('pointercancel', slEnd);
  document.addEventListener('click', e => {
    const kn = e.target.closest('.slide .knob');
    if (kn) {
      e.preventDefault();
      if (e.detail === 0) { const box = kn.parentElement; const act = box.getAttribute('data-slide'); if (ACT[act]) ACT[act](box.getAttribute('data-arg')); }
      return;
    }
    const el = e.target.closest('[data-act]');
    if (!el) return;
    const act = el.getAttribute('data-act');
    const arg = el.getAttribute('data-arg');
    if (ACT[act]) { e.preventDefault(); ACT[act](arg, el); }
  });
  document.addEventListener('input', e => {
    const el = e.target;
    if (!el.dataset) return;
    if (el.id === 'f_amount' && ui.draft) ui.draft.amount = el.value;
    if (el.id === 'f_desc' && ui.draft) ui.draft.desc = el.value;
    if (el.id === 'nt_name') ui.ntName = el.value;
    if (el.dataset.iname != null && ui.draft && ui.draft.items) { const it = ui.draft.items[Number(el.dataset.iname)]; if (it) it.name = el.value; }
    if (el.dataset.iprice != null && ui.draft && ui.draft.items) { const it = ui.draft.items[Number(el.dataset.iprice)]; if (it) { it.price = el.value; refreshItems(); } }
    if (el.dataset.extra && ui.draft) { ui.draft.extra = el.value; refreshItems(); }
    if (el.dataset.camt && ui.draft) {
      ui.draft.customAmts = ui.draft.customAmts || {};
      ui.draft.customAmts[el.dataset.camt] = el.value;
      const st = $('#customStatus');
      if (st) st.innerHTML = customStatusHtml();
    }
  });
  document.addEventListener('change', e => {
    const el = e.target;
    if (el.id === 'f_custom' && ui.draft) {
      ui.draft.custom = el.checked;
      if (el.checked) {
        const t = curTrip();
        ui.draft.customAmts = splitEqual(parseFloat(ui.draft.amount) || 0, ui.draft.parts);
        ui.draft.customAmts = Object.fromEntries(Object.entries(ui.draft.customAmts).map(([k, v]) => [k, String(v)]));
      }
      render();
    }
    if (el.id === 'set_me') { S.me.name = el.value.trim(); meName = S.me.name; save(); render(); }
    if (el.id === 'set_upi') {
      const v = el.value.trim().toLowerCase();
      if (v && !isVpa(v)) { toast(T('upi_bad')); return; }
      S.me.upi = v;
      /* keep "you" in every trip in step, unless a trip already has its own */
      S.trips.forEach(t => (t.members || []).forEach(m => { if (m.self && (!m.upi || m.upi === S.me._prevUpi)) m.upi = v; }));
      S.me._prevUpi = v;
      save(); toast(T('upi_saved'));
    }
    if (el.dataset && el.dataset.upi) {
      const t = curTrip();
      const m = t && memberById(t, el.dataset.upi);
      const v = el.value.trim().toLowerCase();
      if (!m) return;
      if (v && !isVpa(v)) { toast(T('upi_bad')); el.classList.add('bad'); return; }
      el.classList.remove('bad');
      m.upi = v;
      if (m.self && v) { S.me.upi = v; S.me._prevUpi = v; }
      save(); toast(T('upi_saved'));
    }
    if (el.id === 'ai_enabled') { S.settings.ai.enabled = el.checked; save(); render(); }
    if (el.id === 'ai_base') { S.settings.ai.baseUrl = el.value.trim(); save(); }
    if (el.id === 'ai_key') { S.settings.ai.key = el.value.trim(); save(); }
    if (el.id === 'ai_model') { S.settings.ai.model = el.value.trim(); save(); }
    if (el.id === 'set_currency') {
      if (!S.pro) { toast(T('pro_needed')); return; }
      S.settings.currency = el.value; save();
      S.trips.forEach(t => { t.currency = el.value; });
      save(); render();
    }
  });
  document.addEventListener('keydown', e => {
    if (e.key !== 'Enter') return;
    if (e.target.id === 'nt_member') { e.preventDefault(); ACT['nt-add-member'](); }
    if (e.target.id === 'w_name') { e.preventDefault(); ACT['welcome-go'](); }
  });
}

function boot() {
  loadState();
  meName = S.me.name;
  ui = freshUi();
  if (!S.me.name) ui.screen = 'welcome';
  ui.stack = [ui.screen];
  try { history.replaceState({ s: ui.screen }, ''); } catch (e) {}
  wire();
  render();
  if (S.trips.some(t => t.sync && t.sync.on)) getSync().then(() => render()).catch(() => {});
  const joinFromLink = () => {
    try {
      const m = /[#&]join=([^&]+)/.exec(location.hash || '');
      if (!m) return;
      ui.joinPrefill = decodeURIComponent(m[1]).toUpperCase();
      history.replaceState(null, '', location.pathname + location.search);
      if (S.me.name) { go('join'); setTimeout(() => ACT['join-go'](), 0); }
    } catch (e) {}
  };
  joinFromLink();
  window.addEventListener('hashchange', joinFromLink);
  window.addEventListener('online', () => { if (SYNC) render(); });
  window.addEventListener('offline', () => { if (SYNC) render(); });
  try {
    if ('serviceWorker' in navigator && (location.protocol === 'https:' || location.hostname === 'localhost')) {
      navigator.serviceWorker.register('sw.js').catch(() => {});
    }
  } catch (e) {}
}
document.addEventListener('DOMContentLoaded', boot);
if (document.readyState !== 'loading') boot();
</script>
