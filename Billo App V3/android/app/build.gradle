plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

android {
    namespace 'com.billo.app'
    compileSdk 35

    defaultConfig {
        applicationId "com.billo.app"
        minSdk 24
        targetSdk 35
        versionCode 12
        versionName "1.6.2"
    }

    signingConfigs {
        // One fixed debug key, kept in the repo, so every GitHub build can install over the last one
        // (GitHub makes a new random debug key on each run otherwise → "App not installed").
        debug {
            storeFile file('billo-debug.keystore')
            storePassword 'android'
            keyAlias 'androiddebugkey'
            keyPassword 'android'
        }
        release {
            // Create your upload keystore once (see README-ANDROID.md), then fill in:
            // storeFile file('../billo-upload.keystore')
            // storePassword 'YOUR_PASSWORD'
            // keyAlias 'billo'
            // keyPassword 'YOUR_PASSWORD'
        }
    }

    buildTypes {
        debug {
            signingConfig signingConfigs.debug
        }
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            // Enable once signingConfigs.release is filled in:
            // signingConfig signingConfigs.release
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions {
        jvmTarget = '17'
    }
}

dependencies {
    implementation 'androidx.core:core-ktx:1.15.0'
    implementation 'androidx.appcompat:appcompat:1.7.1'
    implementation 'androidx.webkit:webkit:1.12.0'
    implementation 'com.android.billingclient:billing:7.1.1'
}
