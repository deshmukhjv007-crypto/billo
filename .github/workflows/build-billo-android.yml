name: Build Billo Android APK
on:
  push:
    branches: [ main ]
    paths: [ 'Billo App V3/**', '.github/workflows/build-billo-android.yml' ]
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-24.04
    defaults: { run: { working-directory: 'Billo App V3' } }
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with: { node-version: '22' }
      - name: Logic tests
        run: node test/logic_test.js
      - name: Copy web app into the Android shell
        run: python3 scripts/copy_web_to_android.py
      - uses: actions/setup-java@v5
        with: { distribution: temurin, java-version: '17' }
      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: '8.11.1' }
      - name: Point Gradle at the runner's Android SDK
        working-directory: 'Billo App V3/android'
        run: echo "sdk.dir=$ANDROID_HOME" > local.properties
      - name: Build debug APK
        working-directory: 'Billo App V3/android'
        run: gradle --no-daemon --stacktrace assembleDebug
      - uses: actions/upload-artifact@v4
        with: { name: billo-debug-apk, path: 'Billo App V3/android/app/build/outputs/apk/debug/app-debug.apk' }
