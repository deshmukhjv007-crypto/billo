name: Build Prolens Android APK
on:
  push:
    branches: [ main ]
    paths: [ 'prolens-android/**', '.github/workflows/build-android.yml' ]
  pull_request:
    branches: [ main ]
    paths: [ 'prolens-android/**', '.github/workflows/build-android.yml' ]
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: prolens-android } }
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with: { distribution: temurin, java-version: '17' }
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: '8.11.1' }
      - name: Unit tests (camera brain)
        run: gradle --no-daemon --stacktrace testDebugUnitTest
      - name: Build debug APK
        run: gradle --no-daemon --stacktrace assembleDebug
      - uses: actions/upload-artifact@v4
        with: { name: prolens-debug-apk, path: prolens-android/app/build/outputs/apk/debug/app-debug.apk }
      - if: failure()
        uses: actions/upload-artifact@v4
        with: { name: test-report, path: prolens-android/app/build/reports/tests/ }
