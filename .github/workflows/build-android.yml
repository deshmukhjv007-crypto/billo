name: Build Prolens Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frame/prolens/package-lock.json

      - name: Setup Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: platform-tools platforms;android-35 build-tools;35.0.0 ndk;26.1.10909125 cmake;3.22.1

      - name: Install dependencies
        working-directory: frame/prolens
        run: npm ci

      - name: Expo Prebuild
        working-directory: frame/prolens
        run: npx expo prebuild --platform android --no-install

      - name: Pin Kotlin version for Expo modules
        working-directory: frame/prolens/android
        run: |
          printf '\nandroid.kotlinVersion=1.9.25\n' >> gradle.properties
          grep -n 'kotlinVersion' build.gradle gradle.properties

      - name: Build Android Debug APK
        working-directory: frame/prolens/android
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon --stacktrace -Pandroid.kotlinVersion=1.9.25 assembleDebug

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: prolens-camera-app
          path: frame/prolens/android/app/build/outputs/apk/debug/app-debug.apk
