name: Build Prolens Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: 'frame/prolens/package.json'

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install dependencies
        run: |
          cd frame/prolens
          npm install

      - name: Expo Prebuild
        run: |
          cd frame/prolens
          npx expo prebuild --platform android

      - name: Build Android Debug APK
        run: |
          cd frame/prolens/android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: prolens-camera-app
          path: frame/prolens/android/app/build/outputs/apk/debug/app-debug.apk
